<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DSFH Internal Medicine Residency Portal</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,700;1,400;1,700&display=swap" rel="stylesheet">
<style>
/* Eventevia Design System — DSFH Residency Portal */
/* Palette: #FEFBF3 cream · #F6EFE2 parchment · #1F1A12 dark · #c96a4a terracotta · #A47A28 gold · #7FB89C green */
*{box-sizing:border-box;margin:0;padding:0;font-family:'Inter','Segoe UI',system-ui,sans-serif;}
body{background:#FEFBF3;color:#1F1A12;min-height:100vh;}
/* ── App layout ── */
.app-layout{display:flex;min-height:100vh;}
.sidebar{width:250px;background:#1F1A12;flex-shrink:0;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto;}
.sidebar-brand{padding:22px 18px 18px;border-bottom:1px solid rgba(254,251,243,.08);}
.sidebar-brand h1{font-family:'Playfair Display',Georgia,serif;font-size:.95rem;font-weight:700;color:#FEFBF3;letter-spacing:-.01em;line-height:1.4;}
.sidebar-brand p{font-size:.65rem;color:rgba(254,251,243,.35);margin-top:3px;text-transform:uppercase;letter-spacing:.06em;}
.sidebar-user{padding:12px 14px;border-bottom:1px solid rgba(254,251,243,.07);display:flex;align-items:center;gap:10px;}
.sidebar-user-info{min-width:0;}
.sidebar-user-name{font-size:.82rem;font-weight:600;color:#FEFBF3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.sidebar-user-role{font-size:.65rem;color:rgba(254,251,243,.38);margin-top:1px;text-transform:uppercase;letter-spacing:.06em;}
.sidebar-nav{flex:1;padding:8px 0;}
.snav{display:flex;align-items:center;gap:10px;padding:9px 14px;font-size:.82rem;font-weight:500;color:rgba(254,251,243,.4);cursor:pointer;border-left:2px solid transparent;transition:all .15s;margin:1px 8px;border-radius:6px;}
.snav:hover{background:rgba(254,251,243,.06);color:rgba(254,251,243,.78);}
.snav.active{background:rgba(201,106,74,.18);color:#f0c4a8;border-left-color:#c96a4a;font-weight:600;}
.snav .sni{width:18px;height:18px;display:flex;align-items:center;justify-content:center;flex-shrink:0;opacity:.7;}
.snav.active .sni{opacity:1;}
.sidebar-footer{padding:12px 12px 16px;border-top:1px solid rgba(254,251,243,.07);}
.sidebar-acct{background:rgba(254,251,243,.07);border:1px solid rgba(254,251,243,.12);color:rgba(254,251,243,.55);padding:7px 12px;border-radius:6px;cursor:pointer;font-size:.78rem;font-weight:600;width:100%;margin-bottom:6px;transition:all .15s;display:flex;align-items:center;justify-content:center;gap:7px;}
.sidebar-acct svg,.sidebar-logout svg{flex-shrink:0;}
.sidebar-acct:hover{background:rgba(201,106,74,.2);color:#FEFBF3;border-color:rgba(201,106,74,.35);}
.sidebar-logout{background:transparent;border:1px solid rgba(254,251,243,.1);color:rgba(254,251,243,.35);padding:7px 12px;border-radius:6px;cursor:pointer;font-size:.78rem;font-weight:600;width:100%;transition:all .15s;display:flex;align-items:center;justify-content:center;gap:7px;}
.sidebar-logout:hover{background:rgba(185,32,64,.18);color:#fca5a5;border-color:rgba(185,32,64,.3);}
.main-area{flex:1;overflow-y:auto;background:#FEFBF3;min-width:0;height:100vh;}
.nav{display:none;}
/* ── Cards & content ── */
.content{max-width:1040px;margin:0 auto;padding:32px 28px;}
.card{background:transparent;border-radius:0;box-shadow:none;padding:22px 0;margin-bottom:0;border:none;border-bottom:1px solid rgba(31,26,18,.07);}
.card:last-child{border-bottom:none;}
.card-title{font-family:'Playfair Display',Georgia,serif;font-weight:700;font-size:1.05rem;color:#1F1A12;margin-bottom:14px;}
/* ── Stat boxes ── */
.statbox{background:#F6EFE2;border:none;border-radius:10px;padding:16px;text-align:center;}
.statval{font-family:'Playfair Display',Georgia,serif;font-size:1.9rem;font-weight:700;color:#1F1A12;letter-spacing:-.02em;line-height:1.1;}
.statlbl{font-size:.68rem;color:rgba(31,26,18,.4);margin-top:4px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;}
/* ── Pills & tabs ── */
.pill{display:inline-block;padding:4px 14px;border-radius:20px;font-size:.76rem;font-weight:600;cursor:pointer;border:1px solid rgba(31,26,18,.12);background:transparent;color:rgba(31,26,18,.45);transition:all .14s;}
.pill.on{background:#c96a4a;color:#FEFBF3;border-color:#c96a4a;}
.pill.cur{background:#A47A28;color:#FEFBF3;border-color:#A47A28;}
.tab{display:inline-block;padding:7px 18px;border-radius:0;font-size:.82rem;font-weight:600;cursor:pointer;color:rgba(31,26,18,.38);border:none;border-bottom:2px solid transparent;margin-right:4px;transition:all .14s;background:transparent;}
.tab.on{color:#c96a4a;border-bottom-color:#c96a4a;}
.tab-bar{border-bottom:1px solid rgba(31,26,18,.1);margin-bottom:20px;}
/* ── Avatar ── */
.av{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.72rem;color:#fff;flex-shrink:0;}
/* ── Badges ── */
.bdg{display:inline-block;padding:2px 9px;border-radius:20px;font-size:.71rem;font-weight:700;}
.level-badge{padding:3px 10px;border-radius:20px;font-size:.71rem;font-weight:700;color:#fff;}
/* ── Progress ── */
.pbar-bg{background:rgba(31,26,18,.1);border-radius:999px;height:5px;overflow:hidden;flex:1;}
.pbar{height:100%;border-radius:999px;transition:width .4s;}
/* ── Typography ── */
.name{font-weight:700;font-size:.9rem;color:#1F1A12;}
.sub{font-size:.78rem;color:rgba(31,26,18,.42);}
.lbl{font-size:.78rem;font-weight:600;color:rgba(31,26,18,.55);margin-bottom:4px;}
.sh{color:rgba(31,26,18,.4);font-size:.82rem;}
.group-header{font-weight:700;font-size:.65rem;color:rgba(31,26,18,.32);letter-spacing:.1em;padding:14px 0 6px;text-transform:uppercase;border-bottom:1px solid rgba(31,26,18,.07);margin-bottom:4px;}
/* ── Buttons ── */
.sbtn{padding:8px 20px;border-radius:8px;border:none;cursor:pointer;font-weight:600;font-size:.84rem;transition:all .14s;display:inline-flex;align-items:center;gap:6px;}
.sbtn.primary{background:#c96a4a;color:#FEFBF3;}
.sbtn.primary:hover{background:#b5593a;}
.sbtn.danger{background:#b52040;color:#fff;}
.sbtn.danger:hover{background:#9a1835;}
.sbtn.success{background:#2a7a5a;color:#fff;}
.sbtn.success:hover{background:#226648;}
.sbtn.ghost{background:#F6EFE2;color:#1F1A12;border:1px solid rgba(31,26,18,.12);}
.sbtn.ghost:hover{background:#ede5d4;}
.sbtn.warn{background:#A47A28;color:#FEFBF3;}
.sbtn.warn:hover{background:#8a6520;}
.sbtn.small{padding:5px 13px;font-size:.74rem;border-radius:7px;}
.back-btn{display:inline-flex;align-items:center;gap:6px;padding:7px 16px;background:#F6EFE2;border:1px solid rgba(31,26,18,.1);border-radius:8px;cursor:pointer;font-weight:600;font-size:.83rem;color:#1F1A12;margin-bottom:18px;}
.back-btn:hover{background:#ede5d4;}
/* ── Alerts ── */
.alert-red{background:rgba(181,32,64,.05);border:1px solid rgba(181,32,64,.2);color:#7a1022;padding:12px 16px;border-radius:8px;margin-bottom:12px;font-size:.87rem;}
.alert-yellow{background:rgba(164,122,40,.06);border:1px solid rgba(164,122,40,.22);color:#6a4c10;padding:12px 16px;border-radius:8px;margin-bottom:12px;font-size:.87rem;}
.alert-green{background:rgba(127,184,156,.1);border:1px solid rgba(127,184,156,.32);color:#1a5a36;padding:12px 16px;border-radius:8px;margin-bottom:12px;font-size:.87rem;}
/* ── Drop zone ── */
.drop-zone{border:1.5px dashed rgba(31,26,18,.2);border-radius:10px;padding:24px;text-align:center;color:rgba(31,26,18,.38);background:#F6EFE2;}
/* ── Tables ── */
.tbl-wrap{overflow-x:auto;border:1px solid rgba(31,26,18,.08);position:relative;border-radius:10px;background:#FEFBF3;}
table{border-collapse:collapse;width:100%;font-size:.84rem;}
th{background:#F6EFE2;color:rgba(31,26,18,.4);font-weight:700;padding:10px 14px;text-align:left;border-bottom:1px solid rgba(31,26,18,.1);white-space:nowrap;font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;position:sticky;top:0;z-index:3;}
td{padding:10px 14px;border-bottom:1px solid rgba(31,26,18,.06);vertical-align:middle;}
tr:hover td{background:rgba(201,106,74,.04);}
.sticky-col{position:sticky;left:0;background:#FEFBF3;z-index:2;border-right:1px solid rgba(31,26,18,.08);}
tr:hover .sticky-col{background:#fdf9f5;}
/* SCFHS table pins Rotation/SCFHS/Floor as one group. Auto table layout hands slack
   columns extra width, so the offsets are measured by syncScfhsCols() rather than
   assumed from the declared widths; the literals here are only a first-paint guess. */
.scfhs-tbl .sticky-col{border-right:none;}
.scfhs-tbl .sticky-col2{position:sticky;left:var(--c2,176px);background:#FEFBF3;z-index:2;}
.scfhs-tbl .sticky-col3{position:sticky;left:var(--c3,252px);background:#FEFBF3;z-index:2;border-right:1px solid rgba(31,26,18,.08);}
.scfhs-tbl tr:hover .sticky-col2,.scfhs-tbl tr:hover .sticky-col3{background:#fdf9f5;}
.scfhs-tbl th.sticky-col,.scfhs-tbl th.sticky-col2,.scfhs-tbl th.sticky-col3{background:#F6EFE2;z-index:4;}
.lvl-hdr-cell{position:sticky;left:0;background:#F6EFE2;z-index:2;}
.sched-tbl td,.sched-tbl th{border-right:1px solid rgba(31,26,18,.07);}
.sched-tbl .wk-cell{background:#F6EFE2;font-weight:700;color:#1F1A12;text-align:center;vertical-align:middle;border-right:1px solid rgba(31,26,18,.1);white-space:nowrap;}
.sched-tbl tr td{white-space:normal;}
.wk-current-chip{display:inline-block;margin-top:4px;font-size:.58rem;font-weight:700;letter-spacing:.03em;text-transform:uppercase;padding:2px 7px;border-radius:20px;background:#fff3eb;color:#c96a4a;border:1px solid #f0c19e;white-space:nowrap;}
/* ── On-Call Schedule table ── */
.oncall-tbl{width:100%;border-collapse:collapse;}
.oncall-tbl thead tr{background:#1F1A12;}
.oncall-tbl thead th{color:rgba(254,251,243,.6);font-weight:700;padding:12px 14px;text-align:left;font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;border-bottom:none;background:#1F1A12;white-space:nowrap;position:sticky;top:0;z-index:4;}
.oncall-tbl th.oc-sticky-date{position:sticky;left:0;z-index:5;background:#1F1A12;min-width:60px;width:60px;}
.oncall-tbl th.oc-sticky-day{position:sticky;left:60px;z-index:5;background:#1F1A12;border-right:1px solid rgba(254,251,243,.08);min-width:90px;width:90px;}
.oncall-tbl td.oc-sticky-date{position:sticky;left:0;z-index:2;background:inherit;border-right:1px solid rgba(31,26,18,.07);min-width:60px;width:60px;padding:10px 8px;}
.oncall-tbl td.oc-sticky-day{position:sticky;left:60px;z-index:2;background:inherit;border-right:1px solid rgba(31,26,18,.08);min-width:90px;width:90px;}
.oncall-tbl thead th.ctu-h{color:#CBA155;}
.oncall-tbl tbody tr{border-bottom:1px solid rgba(31,26,18,.06);transition:background .1s;}
.oncall-tbl tbody tr:nth-child(even){background:#FEFBF3;}
.oncall-tbl tbody tr:nth-child(odd){background:#faf8f3;}
.oncall-tbl tbody tr:hover td{background:rgba(201,106,74,.05)!important;}
.oncall-tbl tbody tr.oc-we{background:#F6EFE2!important;}
.oncall-tbl tbody tr.oc-we:hover td{background:rgba(127,184,156,.08)!important;}
.oncall-tbl tbody tr.oc-today{background:#fff9f6!important;box-shadow:inset 4px 0 0 #c96a4a;}
.oncall-tbl tbody tr.oc-today:hover td{background:#fff4ef!important;}
.oncall-tbl td{padding:10px 14px;vertical-align:middle;}
.oc-today-badge{display:inline-block;background:#c96a4a;color:#fff;font-size:.58rem;font-weight:700;padding:2px 7px;border-radius:20px;margin-left:7px;vertical-align:middle;letter-spacing:.05em;}
.oc-day-pill{display:inline-block;padding:3px 10px;border-radius:20px;font-size:.73rem;font-weight:700;white-space:nowrap;}
.oc-day-pill.wd{background:rgba(31,26,18,.08);color:rgba(31,26,18,.55);}
.oc-day-pill.we{background:#7FB89C;color:#fff;}
.oc-day-pill.today{background:#c96a4a;color:#fff;}
.oc-name{border-radius:5px;padding:2px 4px;}
.oc-name.oc-spotlight{background:rgba(164,122,40,.18)!important;box-shadow:0 0 0 2px #A47A28 inset;}
.oc-name.oc-spotlight.oc-conflict{background:rgba(201,74,74,.16)!important;box-shadow:0 0 0 2px #c94a4a inset;}
.oc-hover-tip{position:fixed;background:#1F1A12;color:#FEFBF3;padding:9px 12px;font-size:.72rem;line-height:1.5;border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.28);max-width:240px;pointer-events:none;z-index:99999;}
.oc-hover-tip .oc-dp-name{font-weight:700;font-size:.74rem;color:#fff;margin-bottom:3px;}
.oc-hover-tip .oc-dp-line{display:flex;gap:5px;margin-top:2px;}
.oc-hover-tip .oc-dp-warn{color:#f2b8a0;}
.oc-hover-tip .oc-dp-leave{color:#f2c98a;}
/* ── Full-screen schedule view ── */
#oc-fullscreen{position:fixed;inset:0;background:#F6EFE2;z-index:9000;display:none;flex-direction:column;}
#oc-fullscreen.open{display:flex;}
.oc-fs-bar{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;padding:12px 24px;background:#1F1A12;color:#FEFBF3;}
.oc-fs-bar .oc-fs-title{font-family:'Playfair Display',serif;font-weight:400;font-size:1.15rem;}
.oc-fs-close{background:rgba(254,251,243,.12);color:#FEFBF3;border:none;border-radius:8px;padding:8px 16px;font-size:.82rem;font-weight:600;cursor:pointer;}
.oc-fs-close:hover{background:rgba(254,251,243,.2);}
.oc-fs-body{flex:1 1 auto;overflow:hidden;padding:16px 24px 20px;display:flex;gap:18px;}
.oc-fs-tbl-wrap{flex:1 1 auto;min-width:0;overflow-y:auto;overflow-x:hidden;border-radius:12px;box-shadow:0 2px 12px rgba(0,0,0,.08);border:1px solid #ddd6cc;}
.oc-fs-tbl-wrap .oncall-tbl{width:100%;table-layout:fixed;}
.oc-fs-tbl-wrap thead th{position:sticky;top:0;background:#1F1A12;z-index:2;}
.oc-dock-panel{flex:0 0 280px;background:#1F1A12;color:#FEFBF3;border-radius:12px;padding:18px;font-size:.8rem;line-height:1.6;overflow-y:auto;}
.oc-dock-empty{color:rgba(254,251,243,.4);font-style:italic;}
.oc-dock-panel .oc-dp-name{font-weight:700;font-size:.88rem;color:#fff;margin-bottom:8px;}
.oc-dock-panel .oc-dp-line{display:flex;gap:6px;margin-top:6px;}
.oc-dock-panel .oc-dp-warn{color:#f2b8a0;}
.oc-dock-panel .oc-dp-leave{color:#f2c98a;}
/* ── Inputs ── */
.input-sm{padding:5px 9px;border:1px solid rgba(31,26,18,.14);border-radius:6px;font-size:.82rem;width:100%;background:#FEFBF3;}
input,select,textarea{padding:9px 12px;border:1px solid rgba(31,26,18,.15);border-radius:8px;font-size:.87rem;width:100%;outline:none;transition:border .14s;background:#FEFBF3;color:#1F1A12;}
input:focus,select:focus,textarea:focus{border-color:#c96a4a;box-shadow:0 0 0 3px rgba(201,106,74,.1);}
label{display:block;font-size:.78rem;font-weight:600;color:rgba(31,26,18,.55);margin-bottom:4px;}
/* ── Layout helpers ── */
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;}
.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;}
.flex{display:flex;align-items:center;}
.flex-gap{display:flex;align-items:center;gap:8px;}
.flex-wrap{display:flex;flex-wrap:wrap;gap:6px;}
.mt-8{margin-top:8px;}.mt-12{margin-top:12px;}.mt-16{margin-top:16px;}.mb-8{margin-bottom:8px;}.mb-12{margin-bottom:12px;}
.sep{height:1px;background:rgba(31,26,18,.08);margin:16px 0;}
.rot-badge{display:inline-block;padding:3px 9px;border-radius:6px;font-size:.73rem;font-weight:700;white-space:nowrap;}
/* ── Login ── */
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(148deg,#7c3820 0%,#c96a4a 38%,#e8956d 65%,#f2b48a 82%,#fde0c8 100%);}
.login-card{background:#FEFBF3;border-radius:14px;padding:40px 36px;width:380px;box-shadow:0 32px 80px rgba(31,26,18,.35);}
.login-logo{text-align:center;margin-bottom:28px;}
.login-logo h1{font-family:'Playfair Display',Georgia,serif;font-size:1.5rem;font-weight:700;color:#1F1A12;margin-top:10px;letter-spacing:-.02em;}
.login-logo p{font-size:.82rem;color:rgba(31,26,18,.42);margin-top:4px;}
.err{color:#b52040;font-size:.82rem;margin-top:6px;}
/* ── Resident card ── */
.res-card{display:flex;align-items:center;gap:10px;padding:12px 8px;border-radius:0;border:none;border-bottom:1px solid rgba(31,26,18,.07);cursor:pointer;transition:background .14s;margin-bottom:0;background:transparent;}
.res-card:hover,.res-card.on{background:rgba(201,106,74,.05);}
/* ── Forms & modal ── */
.inline-form{background:#F6EFE2;border:1px solid rgba(31,26,18,.09);border-radius:10px;padding:18px;margin-top:12px;}
.modal-overlay{position:fixed;inset:0;background:rgba(31,26,18,.62);display:flex;align-items:center;justify-content:center;z-index:1000;padding:16px;overflow-y:auto;}
.modal-card{background:#FEFBF3;border-radius:12px;padding:28px;width:400px;max-width:100%;box-shadow:0 24px 60px rgba(31,26,18,.28);max-height:90vh;overflow-y:auto;}
.modal-card h3{margin:0 0 4px;color:#1F1A12;font-family:'Playfair Display',Georgia,serif;font-size:1.15rem;font-weight:700;}
.nav-btn2{background:rgba(201,106,74,.1);border:1px solid rgba(201,106,74,.2);color:#c96a4a;padding:5px 12px;border-radius:6px;cursor:pointer;font-size:.8rem;}
/* ── Attendance ── */
.att-p{background:rgba(42,122,90,.1);color:#1a5a36;}
.att-l{background:rgba(164,122,40,.1);color:#6a4c10;}
.att-a{background:rgba(181,32,64,.08);color:#8a1022;}
.att-o{background:rgba(31,26,18,.06);color:rgba(31,26,18,.45);}
.att-e{background:rgba(124,58,237,.08);color:#5b21b6;}
.att-btn{padding:4px 10px;border-radius:6px;border:1px solid rgba(31,26,18,.12);cursor:pointer;font-size:.74rem;font-weight:700;transition:all .12s;}
.att-btn.sel-P{background:#2a7a5a;color:#fff;border-color:#2a7a5a;}
.att-btn.sel-L{background:#A47A28;color:#fff;border-color:#A47A28;}
.att-btn.sel-A{background:#b52040;color:#fff;border-color:#b52040;}
.att-btn.sel-O{background:rgba(31,26,18,.3);color:#fff;border-color:rgba(31,26,18,.3);}
.att-btn.sel-E{background:#7c3aed;color:#fff;border-color:#7c3aed;}
/* ── Attendance Overview (By Block / Overall) ── */
.ov-subtabs{display:flex;gap:4px;margin-bottom:16px;border-bottom:1px solid rgba(31,26,18,.1);}
.ov-subtab{padding:8px 16px;font-size:.8rem;font-weight:500;color:rgba(31,26,18,.45);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;}
.ov-subtab.active{color:#c96a4a;font-weight:600;border-bottom-color:#c96a4a;}
.ov-sortbtn{background:#F6EFE2;color:#1F1A12;border:1px solid rgba(31,26,18,.12);border-radius:999px;padding:6px 15px;font-size:.76rem;font-weight:600;cursor:pointer;}
.ov-sortbtn.active{background:#c96a4a;color:#FEFBF3;border-color:#c96a4a;}
.ov-rank{width:18px;height:18px;border-radius:50%;background:rgba(31,26,18,.08);font-size:.64rem;font-weight:700;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;}
th.ov-th{text-align:center;}
.ov-th-p{color:#2a7a5a;} .ov-th-l{color:#A47A28;} .ov-th-a{color:#b52040;} .ov-th-e{color:#7c3aed;} .ov-th-o{color:rgba(31,26,18,.45);}
.ov-td{text-align:center;font-weight:700;font-size:.82rem;}

<script>
// ─── DATA ────────────────────────────────────────────────────────────────────
let RESIDENTS=[];
// Next year's cohort, created in `residents` months before its year opens. Held out of
// RESIDENTS — and so out of every current-year list — until 1 October of its start year.
// Only the rota builder and the admin panel look at it; use allRoster() to see both.
let INCOMING=[];
let CONSULTANTS=[];
let MENTORS={};
const ROTA_PERIODS=["28/9-25/10","26/10-22/11","23/11-20/12","21/12-17/1","18/1-14/2","15/2-14/3","15/3-11/4","12/4-9/5","10/5-6/6","7/6-4/7","5/7-1/8","2/8-29/8","30/8-26/9"];
// Blocks that do not run the usual 4 weeks, keyed by academic year then block number.
// AY 2025-26 block 13 was extended to 5 weeks (30 Aug - 3 Oct 2026) so the year meets
// AY 2026-27 with no uncovered week in between.
const BLOCK_WEEKS_OVERRIDE={2025:{13:5}};
// The academic year normally turns over on 1 Oct. Where a year starts on a different
// date, record it here as [day, month] so the rollover follows the rota, not the month.
const AY_START_OVERRIDE={2026:[4,10]};
function blockWeeks(blk,ay){return(BLOCK_WEEKS_OVERRIDE[ay]&&BLOCK_WEEKS_OVERRIDE[ay][blk])||4;}
function blockDays(blk,ay){return blockWeeks(blk,ay)*7;}
// Years whose blocks do not follow the shared ROTA_PERIODS at all. AY 2026-27 starts
// Sun 4 Oct 2026, a week later than every previous year, so all 13 of its blocks shift.
// Kept as a separate table because ROTA_PERIODS is read by all five historical years.
const ROTA_PERIODS_OVERRIDE={2026:["4/10-31/10","1/11-28/11","29/11-26/12","27/12-23/1","24/1-20/2","21/2-20/3","21/3-17/4","18/4-15/5","16/5-12/6","13/6-10/7","11/7-7/8","8/8-4/9","5/9-2/10"]};
function rotaPeriods(ay){return ROTA_PERIODS_OVERRIDE[ay]||ROTA_PERIODS;}

// each page needs a fresh one. It must order by something unique, otherwise rows that tie

async function saveRotaCells(entries,ay){
  const year=ay==null?CURRENT_ACADEMIC_YEAR:Number(ay);
  // Only send columns that exist in the base schema (block_label / created_by may not
  // be present in older deployments — omit them so the upsert always succeeds).
  const rows=entries.map(e=>{
    const blk=parseInt(e.block);

    // of 4 and a 2-week segment is silently recorded as a whole block, which corrupts
    // every cumulative week count downstream.
    const weeks=e.weeks!=null?Number(e.weeks)
      :(e.leaveWeeks>0?blockWeeks(blk,year)-Number(e.leaveWeeks):blockWeeks(blk,year));
    return{
      resident_id:e.residentId,academic_year:year,block_number:blk,
      segment:e.segment||1,
      week_start:e.weekStart||1,
      weeks:Math.max(1,weeks),
      rotation_name:e.rotationName||"",
      leave_weeks:e.leaveWeeks||0,leave_position:e.leavePosition||"none" };
  });
  const{error}=await sb.from("rotations").upsert(rows,{onConflict:"resident_id,academic_year,block_number,segment"});
  if(error){showToast("Could not save rota: "+error.message);return false;}
  await loadRotations();

}
// Helper: returns rotation + any split-leave metadata for a resident/block cell

// leave_position "start" → AL is Wk 1-2, rotation is Wk 3-4 (e.g. 2wks/Nephro)
function rotCellInfo(resId,block){

async function loadRotaPlan(){

      .eq("academic_year",PLAN_AY)

  });

// Replace one resident's whole block. `segments` is the full new set, so removing a split

async function savePlanCell(residentId,block,segments){

    .eq("academic_year",PLAN_AY).eq("resident_id",residentId).eq("block_number",blk);

// Copy one approved block of the draft into `rotations`, then mark it published. Residents
// read `rotations`, so this is the only step that makes a block visible to them.
async function pushBlockLive(blk){
  const entries=[];
  Object.keys(ROTA_PLAN).forEach(rid=>{
    (ROTA_PLAN[rid][String(blk)]||[]).forEach(s=>entries.push({
      residentId:parseInt(rid),block:blk,segment:s.seg,weekStart:s.weekStart,weeks:s.weeks,
      rotationName:s.rot,leaveWeeks:s.leaveWeeks,leavePosition:s.leavePos
    }));
  });
  if(!entries.length){showToast("Block "+blk+" has nothing to push.","warning");return false;}
  const ok=await saveRotaCells(entries,PLAN_AY);
  if(!ok)return false;
  await sb.from("rota_plan_block_status").upsert(
    {academic_year:PLAN_AY,block_number:parseInt(blk),state:"published",
     published_by:STATE.user?.profileId||null,published_at:new Date().toISOString(),
     pushed_at:new Date().toISOString(),updated_at:new Date().toISOString()},
    {onConflict:"academic_year,block_number"});
  await loadRotaPlan();
  showToast("Block "+blk+" published — "+entries.length+" assignments are now live.","success");
  return true;
}
// Weeks per rotation that the DRAFT plan adds, for one resident.
function planWeeksFor(resId){
  const acc={},per=ROTA_PLAN[resId]||{};
  Object.keys(per).forEach(blk=>per[blk].forEach(s=>{
    if(s.rot)acc[s.rot]=(acc[s.rot]||0)+s.weeks;
    if(s.leaveWeeks>0)acc["Annual Leave"]=(acc["Annual Leave"]||0)+s.leaveWeeks;
  }));
  return acc;
}
// Everything already on record plus everything the draft would add.
function projectedWeeksFor(resId){
  const acc=histWeeksFor(resId),add=planWeeksFor(resId);

}
// The level a resident will hold in PLAN_AY, or null if they graduate before it starts.
// The incoming cohort already sits in `residents` as active R1s months ahead of its start
// date, so reading `level` straight off would promote them alongside the current R1s.
function planLevel(res){
  if(!res)return null;
  return res.yearStarted>=PLAN_AY?"R1":nextAYLevel(res.level);
}
// The programme works to half the SCFHS total as a hard floor — see SCFHS_FLOOR.
function scfhsCap(rot){return Math.round((SCFHS_TOTAL[rot]||0)*SCFHS_FLOOR);}
// A cell is flagged when the rotation sitting in it is still short of its minimum cap
// once the whole draft year is counted. R1s have the rest of the programme to make it
// up, so theirs is a warning rather than a problem.
function cellShortfall(resId,rot,cum){
  if(!rot||!SCFHS_TOTAL[rot])return null;
  const done=scfhsWeeks(cum||projectedWeeksFor(resId),rot),cap=scfhsCap(rot);
  if(done>=cap)return null;
  return planLevel(resById(resId))==="R1"?"amber":"red";
}

  if(!res){CUMULATIVE_KPI_LOADING=false;return;}
  const startYear=res.yearStarted||CURRENT_ACADEMIC_YEAR;
  const years=[];
  for(let y=startYear;y<=CURRENT_ACADEMIC_YEAR;y++)years.push(y);
  const[scRes,qRes,prRes]=await Promise.all([
    sb.from("kpi_scores").select("*").eq("resident_id",resId).in("academic_year",years),
    sb.from("kpi_quarterly").select("*").eq("resident_id",resId).in("academic_year",years),
    sb.from("kpi_proposals").select("*").eq("resident_id",resId).in("academic_year",years)
  ]);
  const byYear={};
  years.forEach(y=>{byYear[y]={scores:null,quarterly:{},proposals:[]};});
  (scRes.data||[]).forEach(r=>{if(byYear[r.academic_year])byYear[r.academic_year].scores=r;});
  (qRes.data||[]).forEach(r=>{if(byYear[r.academic_year])byYear[r.academic_year].quarterly[r.quarter]=r;});
  (prRes.data||[]).forEach(r=>{if(byYear[r.academic_year])byYear[r.academic_year].proposals.push(r);});

  CUMULATIVE_KPI_LOADING=false;
  render();
}

let LEAVE_PENDING_COUNT=0;

async function loadLeaveRecords(){
  // Unfiltered across every resident, every leave type and every academic year, so it grows
  // without bound and has to page. created_at is not unique (a bulk rota import writes many
  // rows in one transaction), so `id` breaks the tie and keeps paging stable.
  const{data,error}=await fetchAllRows(()=>sb.from("leave_records").select("*").order("created_at",{ascending:false}).order("id",{ascending:false}));
  RESIDENTS.forEach(r=>{if(!LEAVE_DATA[r.id])LEAVE_DATA[r.id]={rota:[],manual:[],absences:[],requests:[]};});
  Object.values(LEAVE_DATA).forEach(ld=>{ld.manual=[];ld.absences=[];ld.requests=[];});
  (error?[]:(data||[])).forEach(row=>{
    if(!LEAVE_DATA[row.resident_id])LEAVE_DATA[row.resident_id]={rota:[],manual:[],absences:[],requests:[]};
    if(row.type==="manual"){
      LEAVE_DATA[row.resident_id].manual.push({id:row.id,from:row.from_date,to:row.to_date,days:row.days,comment:row.comment,approved:row.approved});
    }else if(row.type==="unapproved_absence"){
      LEAVE_DATA[row.resident_id].absences.push({id:row.id,date:row.from_date,days:row.days,comment:row.comment});
    }else if(row.type==="leave_request"||row.type==="leave_rejected"){
      LEAVE_DATA[row.resident_id].requests.push({id:row.id,from:row.from_date,to:row.to_date,days:row.days,comment:row.comment,status:row.type==="leave_request"?"pending":"rejected",createdAt:row.created_at});
    }
  });
  LEAVE_PENDING_COUNT=Object.values(LEAVE_DATA).reduce((n,ld)=>n+(ld.requests||[]).filter(r=>r.status==="pending").length,0);
  render();
}

const ANN_ICON={task:"",research:"",qi:"",presentation:"",deadline:"",other:""};
function downloadRotationICS(resId){
  const res=resById(resId);if(!res)return;
  const fullRota=FULL_ROTA[resId]||{};
  function icsDate(d){return toLocalYMD(d).replace(/-/g,"");}
  function icsEscape(s){return(s||"").replace(/\\/g,"\\\\").replace(/;/g,"\\;").replace(/,/g,"\\,").replace(/\n/g,"\\n");}
  const uid=()=>Math.random().toString(36).slice(2,10);
  const lines=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//DSFH//Residency Portal//EN","CALSCALE:GREGORIAN","METHOD:PUBLISH", "X-WR-CALNAME:"+icsEscape(res.name)+" — DSFH IM","X-WR-TIMEZONE:Asia/Riyadh"];

  // 1 ── Rotation blocks (all-day, 4-week spans)
  ROTA_PERIODS.forEach((_,i)=>{
    const blockNum=i+1;
    const rot=fullRota[String(blockNum)];if(!rot)return;
    const start=blockStartDate(blockNum,CURRENT_ACADEMIC_YEAR);if(!start)return;
    const endExcl=new Date(start.getTime()+28*86400000);
    lines.push("BEGIN:VEVENT", "DTSTART;VALUE=DATE:"+icsDate(start), "DTEND;VALUE=DATE:"+icsDate(endExcl), "SUMMARY:B"+blockNum+" – "+icsEscape(ROT_ABBR[rot]||rot), "DESCRIPTION:"+icsEscape(res.name+" • Block "+blockNum+" • "+rot+" • DSFH IM"), "CATEGORIES:Rotation", "COLOR:green", "UID:dsfh-rot-"+resId+"-b"+blockNum+"@dsfh.local", "END:VEVENT");
  });

  // 2 ── Approved leave blocks
  const ld=LEAVE_DATA[resId]||{};
  (ld.manual||[]).filter(x=>x.approved&&x.from&&x.to).forEach(lv=>{
    const isEdu=lv.comment?.startsWith("[EDU]");
    const endD=new Date(new Date(lv.to).getTime()+86400000);
    lines.push("BEGIN:VEVENT", "DTSTART;VALUE=DATE:"+lv.from.replace(/-/g,""), "DTEND;VALUE=DATE:"+toLocalYMD(endD).replace(/-/g,""), "SUMMARY:"+(isEdu?" Educational Leave":" Annual Leave")+" ("+lv.days+"d)", "DESCRIPTION:"+icsEscape((lv.comment?.replace("[EDU] ","")||"Approved leave")+" • "+res.name), "CATEGORIES:Leave", "UID:dsfh-leave-"+resId+"-"+uid()+"@dsfh.local", "END:VEVENT");
  });

  // 3 ── MM Presentations & Moderator duties
  MM_SESSIONS.forEach(s=>{
    let role=null;
    if(s.presenter_resident_id===resId)role=" MM Presenter";
    else if(s.moderator_resident_id===resId)role=" MM Moderator";
    if(!role)return;
    const d=s.session_date;
    lines.push("BEGIN:VEVENT", "DTSTART;TZID=Asia/Riyadh:"+d.replace(/-/g,"")+"T080000", "DTEND;TZID=Asia/Riyadh:"+d.replace(/-/g,"")+"T090000", "SUMMARY:"+icsEscape(role+": "+s.topic), "DESCRIPTION:"+icsEscape("Block "+s.block_number+" • "+fmtDate(d)+" • DSFH Morning Meeting"), "CATEGORIES:Presentation", "UID:dsfh-pres-"+resId+"-"+s.id+"@dsfh.local", "END:VEVENT");
  });

  // 4 ── Announcements / KPI task deadlines targeting this resident
  announcementsForResident(resId).filter(a=>a.deadline_date).forEach(a=>{
    const icon=ANN_ICON[a.category]||"";
    lines.push("BEGIN:VEVENT", "DTSTART;VALUE=DATE:"+a.deadline_date.replace(/-/g,""), "DTEND;VALUE=DATE:"+a.deadline_date.replace(/-/g,""), "SUMMARY:"+icsEscape(icon+" "+a.title+" — DUE"), "DESCRIPTION:"+icsEscape((a.description||"")+" • DSFH IM Residency"), "CATEGORIES:Deadline", "UID:dsfh-ann-"+a.id+"@dsfh.local", "END:VEVENT");
  });

  lines.push("END:VCALENDAR");
  const blob=new Blob([lines.join("\r\n")],{type:"text/calendar;charset=utf-8"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");a.href=url;
  a.download=res.name.replace(/\s+/g,"_")+"_AY"+CURRENT_ACADEMIC_YEAR+"_"+String(CURRENT_ACADEMIC_YEAR+1).slice(-2)+".ics";
  document.body.appendChild(a);a.click();document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function el(tag,props,...kids){
  const e=document.createElement(tag);
  if(props)Object.entries(props).forEach(([k,v])=>{
    if(k==="cls")e.className=v;
    else if(k==="st")Object.assign(e.style,v);
    else if(k.startsWith("on"))e.addEventListener(k.slice(2).toLowerCase(),v);
    else if(typeof v==="boolean"){if(v)e.setAttribute(k,"");}else e.setAttribute(k,v);
  });
  kids.flat(9).forEach(c=>{
    if(c==null||c===false)return;
    if(typeof c==="string"||typeof c==="number")e.appendChild(document.createTextNode(String(c)));
    else e.appendChild(c);
  });
  return e;
}

function isWeekendDate(ds){const[y,m,d]=ds.split("-").map(Number);const dw=new Date(y,m-1,d).getDay();return dw===5||dw===6;}
function oncallHoursLabel(slotKey,ds){if(slotKey==="ctu1"||slotKey==="ctu2")return"08:00 - 16:00";return isWeekendDate(ds)?"08:00 - 22:00":"16:00 - 22:00";}

function oncallDateObj(ds){const[y,m,d]=ds.split("-").map(Number);return new Date(y,m-1,d);}
function oncallAddDays(ds,n){const dt=oncallDateObj(ds);dt.setDate(dt.getDate()+n);return dt.getFullYear()+"-"+String(dt.getMonth()+1).padStart(2,"0")+"-"+String(dt.getDate()).padStart(2,"0");}
function oncallResidentDatesInBlock(blk,rid,rname){
  const key=rname?rname.trim().toLowerCase():null;
  return ONCALL_DATA.filter(e=>e.block_number===blk&&(rid?e.resident_id===rid:(e.resident_name||"").trim().toLowerCase()===key)).map(e=>e.schedule_date).filter((d,i,a)=>a.indexOf(d)===i).sort();
}
// Preview shown while hovering a candidate name in the on-call cell picker:
// their other on-call days this block (for highlighting), plus any
// back-to-back / consecutive-weekend / approved-leave conflicts with the
// specific cell being edited.
function oncallConflictPreview(blk,targetDate,rid,rname,blockStart,blockEnd){
  const dates=oncallResidentDatesInBlock(blk,rid,rname);
  const lines=[];
  const conflictDates=new Set();
  const dayBefore=oncallAddDays(targetDate,-1),dayAfter=oncallAddDays(targetDate,1);
  if(dates.includes(dayBefore)){lines.push({type:"warn",text:"Also on-call "+fmtDate(dayBefore)+" (day before)"});conflictDates.add(dayBefore);}
  if(dates.includes(dayAfter)){lines.push({type:"warn",text:"Also on-call "+fmtDate(dayAfter)+" (day after)"});conflictDates.add(dayAfter);}
  const weekendDates=dates.filter(isWeekendDate);
  for(let i=0;i<weekendDates.length;i++)for(let j=i+1;j<weekendDates.length;j++){
    const gap=Math.round((oncallDateObj(weekendDates[j])-oncallDateObj(weekendDates[i]))/86400000);
    if(gap>=6&&gap<=8){lines.push({type:"warn",text:"Consecutive weekends: "+fmtDate(weekendDates[i])+" & "+fmtDate(weekendDates[j])});conflictDates.add(weekendDates[i]);conflictDates.add(weekendDates[j]);}
  }
  if(rid){
    const approved=(LEAVE_DATA[rid]?.manual||[]).filter(l=>l.approved);
    const overlap=approved.find(l=>blockStart<=l.to&&l.from<=blockEnd);
    if(overlap){
      const coversTarget=targetDate<=overlap.to&&overlap.from<=targetDate;
      lines.push({type:"leave",text:(coversTarget?"On approved leave: ":"Approved leave this block: ")+fmtDate(overlap.from)+" \u2013 "+fmtDate(overlap.to)});
    }
  }
  return{dates,lines,conflictDates};
}

function oncallSpotlight(blk,targetDate,rid,rname,blockStart,blockEnd,anchorEl){

    document.querySelectorAll(sel).forEach(el=>{

  const label=rid?dname(anyResById(rid)?.name||""):rname;
  let html="<div class='oc-dp-name'>"+label+" \u2014 "+dates.length+" on-call day"+(dates.length===1?"":"s")+" this block</div>";
  lines.forEach(l=>{html+="<div class='oc-dp-line "+(l.type==="leave"?"oc-dp-leave":"oc-dp-warn")+"'>"+(l.type==="leave"?"\uD83C\uDF34 ":"\u26A0 ")+l.text+"</div>";});

  const dockBody=document.getElementById("oc-dock-body");
  if(fsOpen&&dockBody){
    dockBody.innerHTML=html;
    return;
  }
  if(!anchorEl)return;
  const tip=document.createElement("div");
  tip.id="oc-hover-tip";
  tip.className="oc-hover-tip";
  tip.innerHTML=html;
  document.body.appendChild(tip);
  const r=anchorEl.getBoundingClientRect();
  const tipW=240;

  if(left+tipW+8>window.innerWidth)left=Math.max(8,r.left-tipW-10);

  const tipH=tip.offsetHeight||140;

}

function downloadOncallICS(resId){
  const res=resById(resId);if(!res)return;
  const entries=ONCALL_DATA.filter(e=>e.resident_id===resId).sort((a,b)=>a.schedule_date.localeCompare(b.schedule_date));
  if(!entries.length){showToast("No on-call entries found.","warning");return;}
  let ics="BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//DSFH IM//Oncall//EN\r\nCALSCALE:GREGORIAN\r\n";
  entries.forEach(e=>{
    const sl=ONCALL_SLOTS.find(s=>s.key===e.slot_key);
    const lbl=sl?sl.label:e.slot_key;
    const we=isWeekendDate(e.schedule_date);
    const[sh,eh]=(sl&&sl.ctu)?["08","16"]:we?["08","22"]:["16","22"];
    const ds=e.schedule_date.replace(/-/g,"");
    ics+="BEGIN:VEVENT\r\nUID:oncall-"+e.id+"@dsfh.local\r\n";
    ics+="DTSTART:"+ds+"T"+sh+"0000\r\nDTEND:"+ds+"T"+eh+"0000\r\n";
    ics+="SUMMARY:On-Call: "+lbl+(e.is_extra?" (Extra Penalty)":"")+"\r\n";
    ics+="DESCRIPTION:DSFH Internal Medicine On-Call - "+lbl+(e.is_extra?"\\nExtra penalty oncall":"")+"\r\n";
    ics+="END:VEVENT\r\n";
  });
  ics+="END:VCALENDAR";
  const blob=new Blob([ics],{type:"text/calendar"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);
  a.download=res.name.replace(/\s+/g,"_")+"_oncall.ics";a.click();

function calcKPI(id){
  let mmAtt=0,mmTotal=0,mmScore=0;
  Object.values(MM_ATT).forEach(blk=>{Object.values(blk).forEach(day=>{const s=day[id];if(!s||s==='O')return;mmTotal++;if(s==='P'||s==='E'){mmAtt++;mmScore+=1;}else if(s==='L'){mmAtt++;mmScore+=0.5;}});});
  const mmPct=mmTotal?Math.round(mmScore/mmTotal*100):null;
  let tAtt=0,tTotal=0,tScore=0;
  Object.values(TEACH_ATT).forEach(blk=>{Object.values(blk).forEach(day=>{const s=day[id];if(!s||s==='O')return;tTotal++;if(s==='P'||s==='E'){tAtt++;tScore+=1;}else if(s==='L'){tAtt++;tScore+=0.5;}});});
  const tPct=tTotal?Math.round(tScore/tTotal*100):null;
  const rotPct=Math.round(((ROT_H[id]||[]).length/MANDATORY.length)*100);
  const pubQ=QUIZZES.filter(q=>q.published&&q.sc[id]!=null);
  const qAvg=pubQ.length?Math.round(pubQ.reduce((a,q)=>a+Math.round(q.sc[id]/q.max*100),0)/pubQ.length):0;
  const presSessions=MM_SESSIONS.filter(m=>m.academic_year===CURRENT_ACADEMIC_YEAR);
  const pres=presSessions.some(m=>m.presenter_resident_id===id)||presSessions.some(m=>m.moderator_resident_id===id);
  const presCount=presSessions.filter(m=>m.presenter_resident_id===id||m.moderator_resident_id===id).length;
  const commPct=Math.round(((COMM_SC[id]||0)/10)*100);
  const ks=KPI_SCORES[id]||{};
  const af=getApprovedFields(id);
  const qiPct=(ks.qiDone||af.has("qi"))?100:0;
  const pubPct=(ks.bonusPublished||af.has("publication"))?100:0;
  const oralPct=(ks.bonusOral||af.has("oral"))?100:0;
  const posterPct=(ks.bonusPoster||af.has("poster"))?100:0;
  const oralPosterPct=(oralPct||posterPct)?100:0;
  const awardsPct=(ks.awardsHonors||af.has("awards"))?100:0;
  const volunteeringPct=(ks.volunteering||af.has("volunteering"))?100:0;
  const overall=Math.round(
    qAvg*KPI_W.quiz/100+mmPct*KPI_W.mm/100+tPct*KPI_W.teach/100+
    (pres?100:0)*KPI_W.pres/100+commPct*KPI_W.comm/100+
    qiPct*KPI_W.qi/100+pubPct*KPI_W.pub/100+oralPosterPct*KPI_W.oral/100+
    awardsPct*KPI_W.awards/100+volunteeringPct*KPI_W.volunteering/100
  );
  return{mmPct,mmAtt,mmTotal,tPct,tAtt,tTotal,rotPct,qAvg,pres,presCount,commPct,
    qiPct,pubPct,oralPct,posterPct,oralPosterPct,awardsPct,volunteeringPct,overall};
}

function brComputeRankings(){
  const seniors=sortByLevel(RESIDENTS.filter(r=>r.level==="R3"||r.level==="R4"));
  const juniors=sortByLevel(RESIDENTS.filter(r=>r.level==="R1"||r.level==="R2"));
  const totalVoters=brTotalVoters();
  function score(res,col){
    const kpi=kpiOngoingScore(res.id);
    const votes=brVoteCountFor(res.id,col);
    const votePct=totalVoters>0?Math.round(votes/totalVoters*100):0;
    const final=Math.round(kpi*0.5+votePct*0.5);
    return{res,kpi,votes,votePct,final};
  }
  const sRanked=seniors.map(r=>score(r,"senior")).sort((a,b)=>b.final-a.final);

function renderSearchOverlay(){
  const q=(STATE.searchQ||"").trim().toLowerCase();

  RESIDENTS.filter(r=>r.name.toLowerCase().includes(q)).slice(0,8).forEach(r=>{
    results.push({label:r.name,sub:r.level+" · Mentor: "+mentorName(r.id),icon:"",action:()=>set({mod:"kpi",kpiSelRes:r.id,searchQ:""})});

function renderBroadcastModal(){
  if(!STATE.showBroadcast)return null;
  function close(){set({showBroadcast:false});}
  async function send(){
    const title=document.getElementById("bc_title").value.trim();
    const desc=document.getElementById("bc_desc").value.trim();
    const target=document.getElementById("bc_target").value;
    const deadline=document.getElementById("bc_deadline").value||null;
    if(!title){showToast("Please enter a message title.","warning");return;}
    const btn=document.getElementById("bc_btn");
    btn.disabled=true;btn.textContent="Sending…";
    const ann={title,description:desc,category:"general",deadline_date:deadline,
      target_all:target==="all",
      target_level:target.startsWith("level:")?target.replace("level:",""):null,
      target_resident_id:null,
      academic_year:CURRENT_ACADEMIC_YEAR};
    await saveAnnouncement(ann,null);
    close();
  }
  const lvls=["R1","R2","R3","R4"];
  return el("div",{cls:"modal-overlay",onClick:e=>{if(e.target===e.currentTarget)close();}},
    el("div",{cls:"modal-card",st:{width:"480px",maxWidth:"100%"}},
      el("div",{cls:"modal-header"},
        el("div",{cls:"modal-title"}," Broadcast Announcement"),
        el("button",{cls:"modal-close",onClick:close},"×")
      ),
      el("div",{cls:"modal-body"},
        el("div",{cls:"lbl"},"Title / Subject"),
        el("input",{id:"bc_title",cls:"input",placeholder:"e.g. Reminder: Submit logbooks by Friday"}),
        el("div",{cls:"lbl",st:{marginTop:"12px"}},"Message (optional)"),
        el("textarea",{id:"bc_desc",cls:"input",rows:"3",st:{resize:"vertical"},placeholder:"Additional details…"}),
        el("div",{cls:"grid-2",st:{gap:"12px",marginTop:"12px"}},
          el("div",null,
            el("div",{cls:"lbl"},"Target"),
            el("select",{id:"bc_target",cls:"input"},
              el("option",{value:"all"},"All Residents"),
              ...lvls.map(l=>el("option",{value:"level:"+l},l+" Residents"))
            )
          ),
          el("div",null,
            el("div",{cls:"lbl"},"Deadline (optional)"),
            el("input",{id:"bc_deadline",type:"date",cls:"input"})
          )
        )
      ),
      el("div",{cls:"modal-footer"},
        el("button",{cls:"sbtn ghost",onClick:close},"Cancel"),
        el("button",{id:"bc_btn",cls:"sbtn primary",onClick:send}," Send Broadcast")
      )
    )
  );

function renderAccountModal(){
  if(!STATE.showAccount)return null;
  const u=STATE.user;
  function close(){set({showAccount:false});}
  async function saveUsername(){
    const newUser=document.getElementById("acc_uname").value.trim().toLowerCase().replace(/\s+/g,"");
    const msg=document.getElementById("acc_umsg");
    msg.style.color="#b52040";msg.textContent="";
    if(!newUser||newUser.length<3){msg.textContent="Username must be at least 3 characters.";return;}
    if(!/^[a-z0-9._-]+$/.test(newUser)){msg.textContent="Only letters, numbers, dots, dashes or underscores.";return;}
    const btn=document.getElementById("acc_ubtn");
    btn.disabled=true;btn.textContent="Saving…";
    const{error:authErr}=await sb.auth.updateUser({email:newUser+"@"+AUTH_EMAIL_DOMAIN});
    if(authErr){msg.textContent="Could not update: "+authErr.message;btn.disabled=false;btn.textContent="Update Username";return;}
    const{error:dbErr}=await sb.from("profiles").update({username:newUser}).eq("id",u.profileId);
    if(dbErr){btn.disabled=false;btn.textContent="Update Username";msg.textContent="Auth updated but profile sync failed: "+dbErr.message;return;}
    if(u.rid){await sb.from("residents").update({username:newUser}).eq("id",u.rid);}
    btn.disabled=false;btn.textContent="Update Username";
    set({user:{...STATE.user,user:newUser}});
    msg.style.color="#2a7a5a";msg.textContent=" Username changed to '"+newUser+"'. Use it to sign in from now on.";
  }
  async function savePassword(){
    const p1=document.getElementById("acc_p1").value;
    const p2=document.getElementById("acc_p2").value;
    const msg=document.getElementById("acc_pmsg");
    msg.style.color="#dc2626";msg.textContent="";
    if(!p1||p1.length<6){msg.textContent="Password must be at least 6 characters.";return;}
    if(p1!==p2){msg.textContent="Passwords do not match.";return;}
    const btn=document.getElementById("acc_pbtn");
    btn.disabled=true;btn.textContent="Saving…";
    const{error}=await sb.auth.updateUser({password:p1});
    btn.disabled=false;btn.textContent="Update Password";
    if(error){msg.textContent="Could not update password: "+error.message;return;}
    msg.style.color="#26523A";msg.textContent="Password updated.";
    document.getElementById("acc_p1").value="";document.getElementById("acc_p2").value="";
  }
  async function saveDisplayName(){
    const name=document.getElementById("acc_name").value.trim();
    const msg=document.getElementById("acc_nmsg");
    msg.style.color="#dc2626";msg.textContent="";
    if(!name||name.length<2){msg.textContent="Name must be at least 2 characters.";return;}
    const btn=document.getElementById("acc_nbtn");
    btn.disabled=true;btn.textContent="Saving…";
    const{error}=await sb.from("profiles").update({display_name:name}).eq("id",u.profileId);
    btn.disabled=false;btn.textContent="Save Name";
    if(error){msg.textContent="Could not save: "+error.message;return;}
    set({user:{...STATE.user,name:name}});
    msg.style.color="#26523A";msg.textContent="Name updated.";
  }
  async function saveEmail(){
    const email=document.getElementById("acc_email").value.trim();
    const msg=document.getElementById("acc_emsg");
    msg.style.color="#dc2626";msg.textContent="";
    const btn=document.getElementById("acc_ebtn");
    btn.disabled=true;btn.textContent="Saving…";
    const{error}=await sb.rpc("update_my_contact_email",{new_email:email||null});
    btn.disabled=false;btn.textContent="Save Email";
    if(error){msg.textContent="Could not save email: "+error.message;return;}
    set({user:{...STATE.user,contactEmail:email}});
    msg.style.color="#26523A";msg.textContent="Contact email saved.";

function getMyDuties(){
  const u=STATE.user;
  if(!u||u.role!=="resident"||!u.rid)return[];
  const todayStr=toLocalYMD(new Date());
  const duties=[];
  MM_SESSIONS.forEach(s=>{
    if(s.session_date<todayStr)return;
    if(s.presenter_resident_id===u.rid)duties.push({role:"Presenter",session:s});
    if(s.moderator_resident_id===u.rid)duties.push({role:"Moderator",session:s});
  });
  duties.sort((a,b)=>a.session.session_date.localeCompare(b.session.session_date));
  return duties;
}

// One grid cell. A block holds either one rotation, one rotation plus 2 weeks of
// leave, or two rotations of 2 weeks each (segments 1 and 2).
function rotHistCell(cells){
  if(!cells||!cells.length)return el("span",{st:{color:"rgba(31,26,18,.25)",fontSize:".75rem"}},"—");
  const tight=cells.length>1||cells.some(c=>c.leaveWeeks>0);
  const bst=r=>Object.assign(rotStyle(r),tight?{fontSize:".62rem",padding:"2px 6px"}:{});
  const parts=[];
  cells.forEach(c=>{
    if(!c.rot)return;
    if(c.leaveWeeks>0){
      const lv=el("span",{cls:"rot-badge",st:bst("Annual Leave")},"Leave 2w");
      const rt=el("span",{cls:"rot-badge",st:bst(c.rot)},(ROT_ABBR[c.rot]||c.rot)+" 2w");
      if(c.leavePos==="start"){parts.push(lv,rt);}else{parts.push(rt,lv);}
    }else{
      parts.push(el("span",{cls:"rot-badge",st:bst(c.rot)},ROT_ABBR[c.rot]||c.rot));
    }
  });
  if(!parts.length)return el("span",{st:{color:"rgba(31,26,18,.25)",fontSize:".75rem"}},"—");
  if(parts.length===1)return parts[0];
  return el("div",{st:{display:"flex",flexDirection:"column",gap:"2px"}},...parts);
}

// ── Tab 3: cumulative weeks vs the SCFHS minimums
// The three pinned SCFHS columns need their sticky `left` to equal the rendered width
// of the columns before them. Auto table layout hands slack columns extra width, so the
// declared widths are a lower bound, not the answer — measure after layout instead.
// ResizeObserver does not fire for display:table-cell, so the wrapper is what gets
// observed (window/container resize) and a post-render tick covers first paint.
function syncScfhsCols(wrap,a,b){
  wrap.style.setProperty("--c2",a.getBoundingClientRect().width+"px");
  wrap.style.setProperty("--c3",(a.getBoundingClientRect().width+b.getBoundingClientRect().width)+"px");
}

function rotTrackCumulative(){
  const all=visRes().filter(r=>histYearsFor(r.id).length);
  if(!all.length)return el("div",{cls:"card"},"No rota history to compare yet.");
  const lvls=["R1","R2","R3","R4"].filter(l=>all.some(r=>r.level===l));
  const lvl=lvls.includes(STATE.rotTrackLvl)?STATE.rotTrackLvl:"all";
  const rows=lvl==="all"?all:all.filter(r=>r.level===lvl);
  const cum={};rows.forEach(r=>{cum[r.id]=histWeeksFor(r.id);});
  const cell=(w,rot)=>{
    const need=SCFHS_TOTAL[rot],tier=scfhsTier(w,rot);
    const col=tier==="full"?"#26523A":(tier==="floor"?"#8a6d1f":"#B4653F");
    const fill=tier==="full"?"#7FB89C":(tier==="floor"?"#E0C070":"#D98E6A");
    return el("td",{st:{textAlign:"center"}},
      el("div",{st:{fontWeight:"700",fontSize:".78rem",fontVariantNumeric:"tabular-nums",color:col}},w+" wk"),
      el("div",{st:{position:"relative",height:"7px",borderRadius:"99px",background:"rgba(31,26,18,.07)",marginTop:"3px"}},
        el("div",{st:{position:"absolute",left:"0",top:"0",bottom:"0",borderRadius:"99px",

function weekInBlock(s,blk){return s.week_number-4*(blk-1)+1;}
function currentWeekInBlock(blk){
  const start=blockStartDate(blk,CURRENT_ACADEMIC_YEAR);if(!start)return null;
  const today=new Date();today.setHours(0,0,0,0);
  const diffDays=Math.floor((today-start)/86400000);
  if(diffDays<0||diffDays>=blockDays(blk,CURRENT_ACADEMIC_YEAR))return null;
  return Math.floor(diffDays/7)+1;
}

function renderScheduleTable(sessions,blk,cols){
  const byWeek={};
  sessions.forEach(s=>{
    const w=weekInBlock(s,blk);
    if(!byWeek[w])byWeek[w]=[];
    byWeek[w].push(s);
  });
  const weeks=Object.keys(byWeek).map(Number).sort((a,b)=>a-b);
  const curWeek=currentWeekInBlock(blk);
  const bodyRows=[];
  weeks.forEach(w=>{
    const rows=byWeek[w].slice().sort((a,b)=>a.session_date.localeCompare(b.session_date));
    const isCur=w===curWeek;
    rows.forEach((s,i)=>{
      const rowBg=s.row_highlight?s.row_highlight+"26":"#fff";
      const tds=[];
      if(i===0){
        const wkKids=["W"+w];
        if(isCur)wkKids.push(el("div",{cls:"wk-current-chip"},"Current Week"));
        tds.push(el("td",{rowspan:rows.length,cls:"wk-cell"},...wkKids));
      }
      cols.forEach(c=>{
        const stickyStyle=c.stickyLeft?{position:"sticky",left:c.stickyLeft,zIndex:"2",background:rowBg,borderRight:"2px solid #ede5d8",minWidth:c.minW||"auto",maxWidth:c.maxW||"none",overflow:"hidden",whiteSpace:"nowrap"}:{};
        tds.push(el("td",{st:{textAlign:c.center?"center":"left",...stickyStyle}},c.render(s)));
      });
      const rowStyle={};
      if(s.row_highlight){rowStyle.background=s.row_highlight+"26";rowStyle.borderLeft="4px solid "+s.row_highlight;}
      if(isCur&&i===0)rowStyle.borderTop="3px solid #c96a4a";
      if(isCur&&i===rows.length-1)rowStyle.borderBottom="3px solid #c96a4a";
      bodyRows.push(el("tr",{st:Object.keys(rowStyle).length?rowStyle:null},...tds));
    });
  });
  return el("div",{cls:"tbl-wrap"},
    el("table",{cls:"sched-tbl"},
      el("thead",null,el("tr",null,
        el("th",{st:{position:"sticky",top:"0",left:"0",zIndex:"5",background:"#faf6f1",minWidth:"36px",maxWidth:"36px"}},"Wk"),
        ...cols.map(c=>el("th",{st:{position:"sticky",top:"0",zIndex:c.stickyLeft?"5":"3",left:c.stickyLeft||"auto",background:"#faf6f1",minWidth:c.minW||"auto",maxWidth:c.maxW||"none",whiteSpace:"nowrap",overflow:"hidden"}},c.label))
      )),
      sessions.length===0?
        el("tbody",null,el("tr",null,el("td",{colspan:cols.length+1,cls:"sh",st:{textAlign:"center",padding:"14px"}},"No sessions scheduled for this block yet."))):
        el("tbody",null,...bodyRows)
    )
  );
}

// ─── Morning Meeting auto-date generator ─────────────────────────────────────
// Parse ROTA_PERIODS[idx] start date for a given academic year.
function blockStartDate(blockNum,academicYear){
  const idx=blockNum-1;
  const period=rotaPeriods(academicYear)[idx];if(!period)return null;
  const[startStr]=period.split("-");
  const[sd,sm]=startStr.split("/").map(Number);
  // Months at or after the year's own start month belong to the first calendar year.
  // The old fixed threshold of 9 assumed every year began in September; AY 2026-27
  // begins in October, which puts its block 13 (5/9) in the SECOND calendar year.
  const year=(sm>=ayStartMonth(academicYear))?academicYear:academicYear+1;
  return new Date(year,sm-1,sd,0,0,0);
}
// Generate Sunday–Thursday dates for every week of a block (5 days × 4 weeks = 20 sessions,
// or 25 where the block runs 5 weeks — see BLOCK_WEEKS_OVERRIDE).
function mmDatesForBlock(blockNum,academicYear){
  const start=blockStartDate(blockNum,academicYear);if(!start)return[];
  const DAY_NAMES=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
  const dates=[];
  for(let wk=0;wk<blockWeeks(blockNum,academicYear);wk++){
    [0,1,2,3,4].forEach(dow=>{
      const d=new Date(start.getTime()+(wk*7+dow)*86400000);
      const yr=d.getFullYear(),mo=String(d.getMonth()+1).padStart(2,"0"),dy=String(d.getDate()).padStart(2,"0");
      dates.push({date:yr+"-"+mo+"-"+dy,day:DAY_NAMES[d.getDay()],week:wk+1});
    });
  }
  return dates;
}
async function generateMMSessions(blk){
  showConfirm("Auto-generate Sunday–Thursday session slots ("+(blockWeeks(blk,CURRENT_ACADEMIC_YEAR)*5)+" total) for Block "+blk+"? Only dates not already in the schedule will be added.",async()=>{
    const dates=mmDatesForBlock(blk,CURRENT_ACADEMIC_YEAR);
    if(!dates.length){showToast("Could not compute dates for Block "+blk);return;}
    const existingDates=new Set(MM_SESSIONS.filter(s=>s.block_number===blk).map(s=>s.session_date));
    const toInsert=dates.filter(d=>!existingDates.has(d.date));
    if(!toInsert.length){showToast("All session slots for Block "+blk+" already exist.","warning");return;}
    const blockPublished=schedulePublishState(MM_SESSIONS.filter(s=>s.block_number===blk))==="published";
    const rows=toInsert.map(d=>({
      academic_year:CURRENT_ACADEMIC_YEAR,block_number:blk,week_number:4*(blk-1)+d.week-1,
      session_date:d.date,day_label:d.day,topic:"",published:blockPublished,created_by:STATE.user?.profileId||null
    }));
    const{error}=await sb.from("mm_sessions").insert(rows);
    if(error){showToast("Could not generate sessions: "+error.message);return;}
    await loadSchedules();
    showToast("Sessions generated for Block "+blk,"success");
  },"Generate","primary");
}

function attCounts(sessions,attStore,resId){
  let p=0,l=0,a=0,e=0,o=0;
  sessions.forEach(s=>{
    const st=((attStore[s.block_number]||{})[s.session_date]||{})[resId];

}

let PROMOTION_NEEDED=false;
async function checkPromotionNeeded(){
  const m=new Date().getMonth(); // 0-based; 9=Oct,10=Nov,11=Dec
  if(m<9||m>11)return; // only Oct–Dec
  const{data,error}=await sb.from("promotion_log").select("id").eq("academic_year",CURRENT_ACADEMIC_YEAR).maybeSingle();
  if(!error&&!data){PROMOTION_NEEDED=true;render();}
}
function renderPromoModal(){
  const nextLvl={R1:"R2",R2:"R3",R3:"R4"};
  const lvlOrd={R4:0,R3:1,R2:2,R1:3};
  const sorted=RESIDENTS.slice().sort((a,b)=>(lvlOrd[a.level]||9)-(lvlOrd[b.level]||9)||a.name.localeCompare(b.name));
  async function confirmPromo(){
    const btn=document.getElementById("promo_confirm_btn");
    if(btn){btn.disabled=true;btn.textContent="Saving…";}
    const changes=[];
    for(const r of sorted){
      if(STATE.promoSkip[r.id]||r.yearStarted>=PLAN_AY)continue;
      if(r.level==="R4"){
        await sb.from("residents").update({active:false}).eq("id",r.id);
        changes.push({id:r.id,name:r.name,from:"R4",to:"archived"});
      }else if(nextLvl[r.level]){
        await sb.from("residents").update({level:nextLvl[r.level]}).eq("id",r.id);
        changes.push({id:r.id,name:r.name,from:r.level,to:nextLvl[r.level]});
      }
    }
    await sb.from("promotion_log").insert({academic_year:CURRENT_ACADEMIC_YEAR,promoted_by:STATE.user.profileId,changes:JSON.stringify(changes)});
    PROMOTION_NEEDED=false;
    await loadCoreData();
    await loadRotations();
    set({showPromoModal:false,promoSkip:{}});
  }
  return el("div",{cls:"modal-overlay",onClick:e=>{if(e.target===e.currentTarget)set({showPromoModal:false});}},
    el("div",{cls:"modal-card",st:{width:"620px",maxWidth:"100%"}},
      el("h3",null," Promotion Review — AY "+(CURRENT_ACADEMIC_YEAR+1)+"–"+(CURRENT_ACADEMIC_YEAR+2)),
      el("p",{cls:"sh",st:{margin:"6px 0 16px"}},"Everyone is promoted by default. Uncheck anyone who is being held back at their current level. R4 graduates will be archived and removed from active view; the incoming cohort already starts at its own level and is left alone."),
      el("div",{cls:"tbl-wrap"},
        el("table",null,
          el("thead",null,
            el("tr",null,
              el("th",null,"Resident"),el("th",null,"Current"),el("th",null,"Proposed"),
              el("th",{st:{textAlign:"center"}},"Include")
            )
          ),
          el("tbody",null,
            ...sorted.map(r=>{
              // The incoming cohort is added to `residents` months before its year opens,
              // already holding the level it starts on. Promoting would skip them past R1.
              const incoming=r.yearStarted>=PLAN_AY;
              const skip=!!STATE.promoSkip[r.id];
              const proposed=incoming?el("span",{cls:"bdg",st:{background:"#f6efe2",color:"#8a6d3b"}},"Starts as "+r.level)
                :r.level==="R4" ?el("span",{cls:"bdg",st:{background:"#fee2e2",color:"#b91c1c"}},"Archive")
                :nextLvl[r.level]?el("span",{cls:"bdg",st:{background:"#dcfce7",color:"#166534"}},nextLvl[r.level])
                :el("span",{cls:"sh"},"—");
              return el("tr",{st:{opacity:skip||incoming?"0.4":"1",transition:"opacity .15s"}},
                el("td",null,el("div",{cls:"flex-gap"},avEl(r),el("span",{cls:"name",st:{fontSize:".84rem"}},r.name))),
                el("td",null,levelBadge(r.level)),
                el("td",null,proposed),
                el("td",{st:{textAlign:"center"}},
                  incoming?el("span",{cls:"sh",st:{fontSize:".72rem"}},"n/a")
                  :el("input",{type:"checkbox",...(!skip?{checked:""}:{}),
                    onChange:e=>{
                      const sk={...STATE.promoSkip};
                      if(e.target.checked)delete sk[r.id];else sk[r.id]=true;
                      set({promoSkip:sk});
                    }
                  })
                )
              );
            })
          )
        )
      ),
      el("p",{cls:"sh",st:{fontSize:".75rem",marginTop:"10px"}},"R4 residents marked as archived will no longer appear in the portal. Anyone held back keeps their current level and can be promoted later from Admin Panel → Residents."),
      el("div",{cls:"flex-gap",st:{marginTop:"16px",justifyContent:"flex-end",gap:"10px"}},
        el("button",{cls:"sbtn ghost",onClick:()=>set({showPromoModal:false})},"Remind Me Later"),
        el("button",{id:"promo_confirm_btn",cls:"sbtn success",onClick:confirmPromo}," Confirm Promotions")
      )
    )
  );
}

function exportAttendance(type, blk){
  const isMM = type === "mm";
  const sessions = (isMM ? MM_SESSIONS : TEACH_SESSIONS)
    .filter(s => s.block_number === blk)
    .slice().sort((a,b) => a.session_date.localeCompare(b.session_date));
  const ATT = isMM ? MM_ATT : TEACH_ATT;
  const vr = visRes();
  const headers = ["Resident","Level", ...sessions.map(s => fmtDate(s.session_date)+"\n"+s.topic), "Att %"];
  const rows = vr.map(r => {
    let present = 0;
    const cols = sessions.map(s => {
      const st = ((ATT[blk]||{})[s.session_date]||{})[r.id] || "";
      if(st==="P"||st==="L"||st==="E") present++;
      return st || "—";
    });
    const pct = sessions.length ? Math.round(present/sessions.length*100)+"%" : "—";
    return [r.name, r.level, ...cols, pct];
  });
  const aoa = [headers, ...rows];
  const ws = XLSX.utils.aoa_to_sheet(aoa);
  ws["!cols"] = [{wch:24},{wch:6},...sessions.map(()=>({wch:14})),{wch:7}];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "Attendance");
  XLSX.writeFile(wb, (isMM?"MM":"AcademicDay")+"_Attendance_Block"+blk+".xlsx");
}
function exportRota(){
  const levels=["R4","R3","R2","R1"];

function exportOncall(blk){
  const blockStart=blockStartDate(blk,CURRENT_ACADEMIC_YEAR);
  if(!blockStart)return;
  const headers=["Date","Day","ER Medical","Floor 1","Floor 2","Floor 3","CTU A","CTU B"];
  const byDate={};
  ONCALL_DATA.filter(e=>e.block_number===blk).forEach(e=>{
    if(!byDate[e.schedule_date])byDate[e.schedule_date]={};
    byDate[e.schedule_date][e.slot_key]=e;
  });
  const rows=[];
  const DN=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
  for(let i=0;i<blockDays(blk,CURRENT_ACADEMIC_YEAR);i++){
    const d=new Date(blockStart.getTime()+i*86400000);
    const ds=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
    const day=DN[d.getDay()];
    const isWe=d.getDay()===5||d.getDay()===6;
    const sl=byDate[ds]||{};
    const nm=e=>e?(e.resident_id?resById(e.resident_id)?.name||"":e.resident_name||"")+(e.is_extra?" [EXTRA]":""):"";
    rows.push([ds,day,nm(sl.er_medical),nm(sl.bldg1),nm(sl.bldg2),nm(sl.consult),isWe?nm(sl.ctu1):"—",isWe?nm(sl.ctu2):"—"]);
  }
  const ws=XLSX.utils.aoa_to_sheet([headers,...rows]);
  ws["!cols"]=[{wch:12},{wch:12},{wch:20},{wch:20},{wch:20},{wch:20},{wch:20},{wch:20}];
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,"On-Call");
  XLSX.writeFile(wb,"OnCall_Block"+blk+".xlsx");
}

function exportLeave(){
  const vr=visRes();
  const headers=["Resident","Level","Rota Blocks","Annual Used (days)","Edu Used (days)","Absences (days)","Remaining (of 28d)"];
  const rows=vr.map(r=>{
    const ld=LEAVE_DATA[r.id]||{rota:[],manual:[],absences:[]};
    const approvedBlocks=new Set(ld.manual.map(m=>{const mt=m.comment?.match(/Rota leave B(\d+)/);return mt?parseInt(mt[1]):null;}).filter(Boolean));
    const rotaDays=ld.rota.reduce((a,l)=>a+(approvedBlocks.has(l.period)?0:(l.partial?l.weeks*7:28)),0);
    const annualApproved=ld.manual.filter(x=>x.approved&&!x.comment?.startsWith("[EDU]")).reduce((a,x)=>a+(x.days||0),0);
    const eduApproved=ld.manual.filter(x=>x.approved&&x.comment?.startsWith("[EDU]")).reduce((a,x)=>a+(x.days||0),0);
    const absenceDays=ld.absences.reduce((a,x)=>a+(x.days||0),0);
    const remaining=28-(annualApproved+rotaDays);
    return[r.name,r.level,ld.rota.length,annualApproved+rotaDays,eduApproved,absenceDays,remaining];
  });
  const ws=XLSX.utils.aoa_to_sheet([headers,...rows]);
  ws["!cols"]=[{wch:24},{wch:6},{wch:14},{wch:18},{wch:16},{wch:16},{wch:18}];
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,"Leave Summary");
  XLSX.writeFile(wb,"Leave_Summary_AY"+CURRENT_ACADEMIC_YEAR+"_"+(CURRENT_ACADEMIC_YEAR+1).toString().slice(2)+".xlsx");
}

              };
              reader.readAsArrayBuffer(file);
            }})

// ─── QUARTERLY KPI HELPERS ───────────────────────────────────────────────────
// Quarters follow the academic year: Q1 Oct–Dec (B1-3), Q2 Jan–Mar (B4-6),
// Q3 Apr–Jun (B7-9), Q4 Jul–Sep (B10-13).
const QUARTER_BLOCKS={1:[1,2,3],2:[4,5,6],3:[7,8,9],4:[10,11,12,13]};
const QUARTER_LABELS={1:"Q1 Oct–Dec",2:"Q2 Jan–Mar",3:"Q3 Apr–Jun",4:"Q4 Jul–Sep"};
function currentQuarter(){
  const m=new Date().getMonth()+1;
  if(m>=10)return 1;
  if(m<=3)return 2;
  if(m<=6)return 3;
  return 4;
}
// Attendance + quiz stats for a specific resident within the given block list.
function calcKPIQ(id,qBlocks){
  let mmAtt=0,mmTotal=0,mmScore=0,tAtt=0,tTotal=0,tScore=0;
  qBlocks.forEach(blk=>{
    const blkAtt=MM_ATT[blk]||{};
    Object.values(blkAtt).forEach(day=>{const s=day[id];if(!s||s==='O')return;mmTotal++;if(s==='P'||s==='E'){mmAtt++;mmScore+=1;}else if(s==='L'){mmAtt++;mmScore+=0.5;}});
    const tBlk=TEACH_ATT[blk]||{};
    Object.values(tBlk).forEach(day=>{const s=day[id];if(!s||s==='O')return;tTotal++;if(s==='P'||s==='E'){tAtt++;tScore+=1;}else if(s==='L'){tAtt++;tScore+=0.5;}});
  });
  const mmPct=mmTotal?Math.round(mmScore/mmTotal*100):null;
  const tPct=tTotal?Math.round(tScore/tTotal*100):null;
  const pubQ=QUIZZES.filter(q=>q.published&&q.sc[id]!=null&&qBlocks.includes(q.block));
  const qAvg=pubQ.length?Math.round(pubQ.reduce((a,q)=>a+Math.round(q.sc[id]/q.max*100),0)/pubQ.length):null;
  const presCount=MM_SESSIONS.filter(s=>s.presenter_resident_id===id&&s.academic_year===CURRENT_ACADEMIC_YEAR&&qBlocks.includes(s.block_number)).length;
  return{mmPct,mmAtt,mmTotal,tPct,tAtt,tTotal,qAvg,quizCount:pubQ.length,presCount};
}

// ─── CUMULATIVE KPI (TRAINING RECORD) ────────────────────────────────────────
function renderCumulativeKPI(){
  const u=STATE.user;
  const vr=visRes();
  let selId=isResident()?u.rid:(STATE.cumKpiRes||vr[0]?.id);
  const res=resById(selId)||vr[0];
  if(!res)return el("div",{cls:"content"},el("p",{cls:"sh"},"No residents found."));
  if(!CUMULATIVE_KPI[res.id]&&!CUMULATIVE_KPI_LOADING){
    loadCumulativeKpi(res.id);
    return el("div",{cls:"content"},
      el("div",{st:{marginBottom:"28px"}},
        el("div",{st:{fontSize:".68rem",fontWeight:"700",letterSpacing:".1em",textTransform:"uppercase",color:"#c96a4a",marginBottom:"8px"}},"Academic History"),
        el("h1",{st:{fontFamily:"'Playfair Display',serif",fontSize:"2rem",fontWeight:"400",color:"#1F1A12",marginBottom:"4px"}},"Training Record")
      ),
      el("p",{st:{color:"rgba(31,26,18,.45)",fontSize:".88rem"}},"Loading training history...")
    );
  }
  if(CUMULATIVE_KPI_LOADING&&!CUMULATIVE_KPI[res.id]){
    return el("div",{cls:"content"},
      el("div",{st:{marginBottom:"28px"}},
        el("div",{st:{fontSize:".68rem",fontWeight:"700",letterSpacing:".1em",textTransform:"uppercase",color:"#c96a4a",marginBottom:"8px"}},"Academic History"),
        el("h1",{st:{fontFamily:"'Playfair Display',serif",fontSize:"2rem",fontWeight:"400",color:"#1F1A12",marginBottom:"4px"}},"Training Record")
      ),
      el("p",{st:{color:"rgba(31,26,18,.45)",fontSize:".88rem"}},"Loading training history...")
    );
  }
  const data=CUMULATIVE_KPI[res.id]||{};
  const startYear=res.yearStarted||CURRENT_ACADEMIC_YEAR;
  const years=[];
  for(let y=startYear;y<=CURRENT_ACADEMIC_YEAR;y++)years.push(y);
  const yearsDesc=[...years].reverse();
  const expandedYear=STATE.cumKpiYear;
  const lvlNums={R1:1,R2:2,R3:3,R4:4};
  const lvlNames={1:"R1",2:"R2",3:"R3",4:"R4"};
  function levelForYear(year){
    const cur=lvlNums[res.level]||1;
    const n=cur-(CURRENT_ACADEMIC_YEAR-year);
    return lvlNames[Math.max(1,Math.min(4,n))];
  }
  function svi(paths,w,h){
    const ns="http://www.w3.org/2000/svg";
    const svg=document.createElementNS(ns,"svg");
    svg.setAttribute("width",String(w||12));svg.setAttribute("height",String(h||12));
    svg.setAttribute("viewBox","0 0 24 24");svg.setAttribute("fill","none");
    svg.setAttribute("stroke","currentColor");svg.setAttribute("stroke-width","2");
    svg.setAttribute("stroke-linecap","round");svg.setAttribute("stroke-linejoin","round");
    svg.style.display="inline-block";svg.style.verticalAlign="middle";svg.style.flexShrink="0";
    svg.innerHTML=paths;
    return svg;
  }
  const achFields=[
    {pk:"publication",label:"Publication",icon:'<path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/>'},
    {pk:"qi",label:"QI Project",icon:'<polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>'},
    {pk:"oral",label:"Oral Pres.",icon:'<polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>'},
    {pk:"poster",label:"Poster",icon:'<rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 21V9"/>'},
    {pk:"awards",label:"Award",icon:'<circle cx="12" cy="8" r="6"/><path d="M15.477 12.89L17 22l-5-3-5 3 1.523-9.11"/>'},
    {pk:"volunteering",label:"Volunteer",icon:'<path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87"/>'}
  ];
  function yearCard(year){
    const yd=data[year]||{scores:null,quarterly:{},proposals:[]};
    const sc=yd.scores;
    const isCurrent=year===CURRENT_ACADEMIC_YEAR;
    const isExpanded=expandedYear===year;
    const lvl=levelForYear(year);
    const lvlColor={R1:"#c96a4a",R2:"#A47A28",R3:"#26523A",R4:"#2a4a7a"}[lvl]||"#888";
    const approved=new Set(yd.proposals.filter(p=>p.status==="approved"&&p.quarter==null).map(p=>p.field_key));
    if(sc){
      if(sc.bonus_published)approved.add("publication");
      if(sc.qi_participated)approved.add("qi");
      if(sc.bonus_oral)approved.add("oral");
      if(sc.bonus_poster)approved.add("poster");
      if(sc.awards_honors)approved.add("awards");
      if(sc.volunteering)approved.add("volunteering");
    }
    const commScore=sc?sc.committee_score||0:null;
    const hdr=el("div",{st:{display:"flex",alignItems:"center",gap:"14px",padding:"16px 20px",cursor:"pointer",userSelect:"none",background:isExpanded?"#F6EFE2":"transparent",transition:"background .15s"},onClick:()=>set({cumKpiYear:isExpanded?null:year})},
      el("div",{st:{textAlign:"center",minWidth:"54px"}},
        el("div",{st:{fontFamily:"'Playfair Display',Georgia,serif",fontSize:"1rem",fontWeight:"700",color:isCurrent?"#c96a4a":"#1F1A12",lineHeight:"1"}},year+"-"+(year+1).toString().slice(2)),
        el("span",{st:{marginTop:"5px",display:"inline-block",fontSize:".62rem",fontWeight:"700",padding:"2px 8px",borderRadius:"9999px",background:lvlColor+"1a",color:lvlColor}},lvl)
      ),
      el("div",{st:{flex:"1",display:"flex",alignItems:"center",gap:"5px",flexWrap:"wrap"}},
        ...achFields.map(f=>el("div",{st:{display:"flex",alignItems:"center",gap:"3px",padding:"3px 8px",borderRadius:"9999px",background:approved.has(f.pk)?"rgba(127,184,156,.18)":"rgba(31,26,18,.05)",color:approved.has(f.pk)?"#26523A":"rgba(31,26,18,.22)",fontSize:".62rem",fontWeight:approved.has(f.pk)?"700":"400",whiteSpace:"nowrap"}},
          svi(f.icon,9,9),el("span",null,f.label)
        ))
      ),
      commScore!=null?el("div",{st:{textAlign:"center",minWidth:"38px"}},
        el("div",{st:{fontFamily:"'Playfair Display',Georgia,serif",fontSize:".95rem",fontWeight:"700",color:"#A47A28"}},commScore),
        el("div",{st:{fontSize:".58rem",textTransform:"uppercase",letterSpacing:".05em",color:"rgba(31,26,18,.3)"}},"Comm.")
      ):null,
      isCurrent?el("button",{cls:"sbtn ghost",st:{fontSize:".7rem",padding:"3px 9px",whiteSpace:"nowrap"},onClick:e=>{e.stopPropagation();set({mod:"kpi",kpiSelRes:res.id,kpiTab:"ongoing"})}},"Full KPI"):null,
      el("div",{st:{color:"rgba(31,26,18,.3)",transform:isExpanded?"rotate(180deg)":"rotate(0deg)",transition:"transform .2s",marginLeft:"4px"}},svi('<polyline points="6 9 12 15 18 9"/>',14,14))
    );
    if(!isExpanded)return el("div",{st:{borderBottom:"1px solid rgba(31,26,18,.07)"}},hdr);
    const body=el("div",{st:{borderBottom:"1px solid rgba(31,26,18,.07)"}},
      hdr,
      el("div",{st:{padding:"0 20px 20px",background:"#F6EFE2"}},
        el("div",{st:{display:"grid",gridTemplateColumns:"repeat(2,1fr)",gap:"10px"}},
          ...[1,2,3,4].map(q=>{
            const qd=yd.quarterly[q]||{};
            const ql=QUARTER_LABELS[q]||("Q"+q);
            const research=qd.research_milestone||"";
            const improvement=qd.improvement_area||"";
            return el("div",{st:{background:"#FEFBF3",borderRadius:"10px",padding:"12px 14px"}},
              el("div",{st:{fontSize:".63rem",fontWeight:"700",textTransform:"uppercase",letterSpacing:".06em",color:"#c96a4a",marginBottom:"8px"}},ql),
              el("div",{st:{marginBottom:"8px"}},
                el("div",{st:{fontSize:".63rem",fontWeight:"700",color:"rgba(31,26,18,.33)",marginBottom:"3px"}},"Research Milestone"),
                research?el("div",null,
                  el("div",{st:{fontSize:".76rem",color:"#1F1A12",fontStyle:"italic",lineHeight:"1.45"}},"\u201c"+research+"\u201d"),
                  qd.research_achieved?el("div",{st:{fontSize:".63rem",fontWeight:"700",color:"#26523A",marginTop:"3px"}},"Achieved"):null
                ):el("div",{st:{fontSize:".7rem",color:"rgba(31,26,18,.25)",fontStyle:"italic"}},"Not set")
              ),
              el("div",null,
                el("div",{st:{fontSize:".63rem",fontWeight:"700",color:"rgba(31,26,18,.33)",marginBottom:"3px"}},"Area of Improvement"),
                improvement?el("div",null,
                  el("div",{st:{fontSize:".76rem",color:"#1F1A12",fontStyle:"italic",lineHeight:"1.45"}},"\u201c"+improvement+"\u201d"),
                  qd.improvement_achieved?el("div",{st:{fontSize:".63rem",fontWeight:"700",color:"#26523A",marginTop:"3px"}},"Achieved"):null
                ):el("div",{st:{fontSize:".7rem",color:"rgba(31,26,18,.25)",fontStyle:"italic"}},"Not set")
              )
            );
          })
        )
      )
    );
    return body;
  }
  return el("div",{cls:"content"},
    el("div",{st:{display:"flex",alignItems:"flex-start",justifyContent:"space-between",gap:"16px",marginBottom:"28px"}},
      el("div",null,
        el("div",{st:{fontSize:".68rem",fontWeight:"700",letterSpacing:".1em",textTransform:"uppercase",color:"#c96a4a",marginBottom:"8px"}},"Academic History"),
        el("h1",{st:{fontFamily:"'Playfair Display',serif",fontSize:"2rem",fontWeight:"400",color:"#1F1A12",marginBottom:"4px"}},"Training Record"),
        el("div",{st:{fontSize:".82rem",color:"rgba(31,26,18,.45)"}},dname(res.name)+" · "+years.length+" year"+(years.length!==1?"s":"")+" · AY "+startYear+"-"+(CURRENT_ACADEMIC_YEAR+1).toString().slice(2))
      ),
      !isResident()?el("select",{cls:"input",st:{width:"auto",fontSize:".84rem"},onChange:e=>{const id=parseInt(e.target.value);CUMULATIVE_KPI_LOADING=false;set({cumKpiRes:id,cumKpiYear:null});loadCumulativeKpi(id);}},
        ...sortByLevel(vr).map(r=>el("option",{value:r.id,...(r.id===res.id?{selected:""}:{})},dname(r.name)+" ("+r.level+")"))
      ):null
    ),
    el("div",{st:{border:"1px solid rgba(31,26,18,.09)",borderRadius:"14px",overflow:"hidden"}},
      ...yearsDesc.map(y=>yearCard(y))
    )
  );
}
// ─── KPI DASHBOARD ───────────────────────────────────────────────────────────
function renderKPI(){
  const vr=visRes();
  const u=STATE.user;
  if(isConsultant())return renderMentorHome();
  let selId=isResident()?u.rid:(STATE.kpiSelRes||vr[0]?.id);
  const res=resById(selId)||vr[0];
  if(!res)return el("div",null,"No residents");
  const k=calcKPI(res.id);
  const kpiColor=v=>v>=80?"#26523A":v>=60?"#A47A28":"#dc2626";
  const tab=STATE.kpiTab||"ongoing";
  const canEdit_=canEditKPI(res.id);
  const isMyRes=isResident()&&u.rid===res.id;
  const isMentor=isConsultant()&&MENTORS[res.id]===u.cid;
  const canSetMilestone=isPD()||STATE.user?.role==="chief"||isMentor;

  // ── Achievement card with proposal/approval flow ──────────────
  function renderProposalDetails(p){
    const m=parseProposalNote(p.note);
    const rows=[];
    if(m.raw)rows.push(el("div",{cls:"sh",st:{fontStyle:"italic"}},"\""+m.raw+"\""));
    if(m.title)rows.push(el("div",{st:{fontSize:".8rem",fontWeight:"700",color:"#1F1A12"}},m.title));
    if(m.authors)rows.push(el("div",{cls:"sh"},"Authors: "+m.authors));
    if(m.journal)rows.push(el("div",{cls:"sh"},"Journal: "+m.journal));
    if(m.year)rows.push(el("div",{cls:"sh"},"Year: "+m.year));
    if(m.event)rows.push(el("div",{cls:"sh"},"Event: "+m.event));
    if(m.date)rows.push(el("div",{cls:"sh"},"Date: "+m.date));
    if(m.issuer)rows.push(el("div",{cls:"sh"},"Issuing body: "+m.issuer));
    if(m.organization)rows.push(el("div",{cls:"sh"},"Organization: "+m.organization));
    if(m.description)rows.push(el("div",{cls:"sh"},"Description: "+m.description));
    if(m.supervisor)rows.push(el("div",{cls:"sh"},"Supervisor: "+m.supervisor+(m.supervisorEmail?" ("+m.supervisorEmail+")":"")));
    if(m.link)rows.push(el("a",{href:m.link,target:"_blank",st:{fontSize:".78rem",color:"#c96a4a","wordBreak":"break-all"}}," "+m.link));
    if(m.fileUrl)rows.push(el("button",{st:{fontSize:".78rem",color:"#c96a4a",background:"none",border:"none",padding:"0",cursor:"pointer",textDecoration:"underline"},onClick:async function(e){const btn=e.currentTarget;btn.textContent="Opening...";btn.disabled=true;const url=await getKpiFileUrl(m.fileUrl);if(url)window.open(url,"_blank");btn.textContent="View uploaded file";btn.disabled=false;}},"View uploaded file"));
    return rows.length?el("div",{st:{marginBottom:"6px"}}, ...rows):null;
  }
  function renderAchievement(fieldKey,icon,label,weight,isApproved){
    const pending=KPI_PROPOSALS.filter(p=>p.resident_id===res.id&&p.field_key===fieldKey&&p.quarter==null&&p.status==="pending");
    const rejected=KPI_PROPOSALS.filter(p=>p.resident_id===res.id&&p.field_key===fieldKey&&p.quarter==null&&p.status==="rejected");
    const approvedProps=KPI_PROPOSALS.filter(p=>p.resident_id===res.id&&p.field_key===fieldKey&&p.quarter==null&&p.status==="approved");
    const border=isApproved?"#bbf7d0":pending.length?"#fde68a":"rgba(31,26,18,.1)";
    const bg=isApproved?"#f0fdf4":pending.length?"#fefce8":"#F6EFE2";
    const submitLabels={publication:"+ Submit Research Publication",oral:"+ Submit Oral Presentation",poster:"+ Submit Poster Presentation",qi:"+ Submit QI Project",awards:"+ Submit Award / Honor",volunteering:"+ Submit Volunteering Activity"};
    const submitMoreLabels={publication:"+ Submit Another Publication",oral:"+ Submit Another Oral Presentation",poster:"+ Submit Another Poster Presentation",qi:"+ Submit Another QI Project",awards:"+ Submit Another Award / Honor",volunteering:"+ Submit Another Volunteering Activity"};
    return el("div",{st:{background:bg,borderRadius:"12px",padding:"14px 16px",border:"1px solid "+border}},
      el("div",{cls:"flex-gap",st:{marginBottom:"8px"}},
        el("span",{st:{fontSize:"1.3rem"}},icon),
        el("div",{st:{flex:"1"}},
          el("div",{st:{fontWeight:"700",fontSize:".88rem",color:"#1F1A12"}},label),
          el("div",{cls:"sh"},weight+"% weight")
        ),
        isApproved?el("span",{st:{background:"#dcfce7",color:"#166534",borderRadius:"6px",padding:"2px 8px",fontSize:".74rem",fontWeight:"700"}},
          approvedProps.length>1?"Verified ("+approvedProps.length+")":"Verified" ):
        pending.length?el("span",{st:{background:"rgba(164,122,40,.12)",color:"#6a4c10",borderRadius:"6px",padding:"2px 8px",fontSize:".74rem",fontWeight:"700"}},"Pending"):
        el("span",{st:{background:"#FEFBF3",color:"#64748b",borderRadius:"6px",padding:"2px 8px",fontSize:".74rem"}},"— Not yet")
      ),
      // All approved proposals with individual undo buttons
      ...approvedProps.map(ap=>el("div",{st:{borderTop:"1px solid #dcfce7",paddingTop:"8px",marginTop:"4px"}},
        renderProposalDetails(ap),
        isPD()?el("button",{cls:"sbtn ghost",st:{fontSize:".7rem",padding:"2px 8px",color:"#dc2626",borderColor:"#fca5a5",marginTop:"4px"},onClick:()=>revokeKpiApproval(res.id,fieldKey,ap.id)},"Undo"):null
      )),
      // PD review panel for pending proposals
      isPD()&&pending.length?el("div",{st:{marginTop:"6px"}},
        ...pending.map(p=>el("div",{st:{background:"#fff",border:"1px solid #fde68a",borderRadius:"8px",padding:"8px 10px",marginBottom:"4px"}},
          el("div",{st:{fontSize:".78rem",fontWeight:"600",marginBottom:"6px"}}, "Submitted by "+(p.proposed_by_role==="resident"?"the resident":p.proposed_by_role==="consultant"?"the mentor":p.proposed_by_role==="chief"?"Chief Resident":p.proposed_by_role)+ " · "+new Date(p.proposed_at).toLocaleDateString("en-GB",{day:"numeric",month:"short"})
          ),
          renderProposalDetails(p),

          )
        ))
