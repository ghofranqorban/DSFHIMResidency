      (canEdit_||canSetMilestone||isMyRes)?

          _kpiPropLive={};set({kpiPropModal:{resId:res.id,fieldKey},kpiPropUploading:false});
        }},(isApproved||approvedProps.length)?(submitMoreLabels[fieldKey]||"Submit Another"):(submitLabels[fieldKey]||"+ Submit Achievement")):null,
      // Show rejection note only if nothing approved or pending
      !isApproved&&!pending.length&&rejected.length?
        el("div",{st:{fontSize:".74rem",color:"#dc2626",marginTop:"4px"}},"Previous submission was rejected"):null
    );
  }

        ),
        el("div",{st:{flex:"1"}},

        ),
        statusPill

      ),
      el("div",{st:{fontSize:".72rem",color:"rgba(31,26,18,.38)",marginBottom:"16px"}},"Blocks "+qBlocks.join(", ")+" · Quarterly stats are informational — not included in overall KPI score"),

  // ── Score totals ──────────────────────────────────────────────
  const ongoingRaw=k.qAvg*KPI_W.quiz/100+k.mmPct*KPI_W.mm/100+k.tPct*KPI_W.teach/100+(k.pres?KPI_W.pres:0);
  const yearlyRaw=k.commPct*KPI_W.comm/100+k.qiPct*KPI_W.qi/100+k.pubPct*KPI_W.pub/100+k.oralPosterPct*KPI_W.oral/100+k.awardsPct*KPI_W.awards/100+k.volunteeringPct*KPI_W.volunteering/100;
  const ongoingScore=Math.round(ongoingRaw);

  // SVG icon helpers
  function svgIcon(paths,w,h){

    svg.style.display="inline-block";svg.style.verticalAlign="middle";svg.style.flexShrink="0";
    svg.innerHTML=paths;
    return svg;
  }

function renderLeaveRequests(){
  // Collect all requests across residents
  const pending=[];const rejected=[];const rotaPending=[];
  RESIDENTS.forEach(r=>{
    (LEAVE_DATA[r.id]?.requests||[]).forEach(req=>{
      if(req.status==="pending")pending.push({...req,res:r});
      else rejected.push({...req,res:r});
    });
    // Rota-detected leaves not yet formally approved
    const ld=LEAVE_DATA[r.id]||{rota:[],manual:[]};
    const approvedBlocks=new Set((ld.manual||[]).map(m=>{const mt=m.comment?.match(/Rota leave B(\d+)/);return mt?parseInt(mt[1]):null;}).filter(Boolean));
    (ld.rota||[]).filter(l=>!approvedBlocks.has(l.period)).forEach(l=>rotaPending.push({...l,res:r}));
  });
  pending.sort((a,b)=>a.createdAt?.localeCompare(b.createdAt||"")||0);
  rotaPending.sort((a,b)=>a.period-b.period);
  const isEdu=c=>c?.startsWith("[EDU]");
  const cleanComment=c=>c?.replace("[EDU] ","")?.split("\n")[0]||"";

  function reqRow(req,showActions){
    const edu=isEdu(req.comment);
    const rejected=req.status==="rejected";
    const rejNote=req.comment?.split("\n").find(l=>l.startsWith("[Rejection note:"))?.replace("[Rejection note: ","").replace("]","");
    return el("div",{st:{padding:"12px",border:"1px solid "+(rejected?"#fca5a5":edu?"#ddd6fe":"#bfdbfe"),borderRadius:"10px",marginBottom:"8px",background:rejected?"#fff5f5":edu?"#faf5ff":"#eff6ff"}},
      el("div",{cls:"flex-gap",st:{flexWrap:"wrap",gap:"8px",marginBottom:"6px"}},
        el("div",{cls:"flex-gap",st:{gap:"8px",alignItems:"center",flex:"1"}},
          avEl(req.res),
          el("div",null,
            el("div",{st:{fontWeight:"700",fontSize:".88rem"}},req.res.name),
            el("div",{cls:"sub"},req.res.level+" · Mentor: "+mentorName(req.res.id))
          )
        ),
        el("span",{cls:"bdg",st:{background:edu?"#ede9fe":"rgba(38,82,58,.12)",color:edu?"#5b21b6":"#26523A"}},edu?" Educational":" Annual"),
        el("span",{cls:"bdg",st:{background:"#FEFBF3",color:"#475569"}},req.days+"d")
      ),
      el("div",{st:{fontSize:".82rem",color:"#1F1A12",marginBottom:"4px"}}, " "+fmtDate(req.from)+" → "+fmtDate(req.to)
      ),
      cleanComment(req.comment)?el("div",{st:{fontSize:".82rem",color:"rgba(31,26,18,.42)",marginBottom:"4px"}}," "+cleanComment(req.comment)):null,
      rejected&&rejNote?el("div",{st:{fontSize:".78rem",color:"#b91c1c",marginTop:"4px"}}," Rejected: "+rejNote):null,
      showActions?el("div",{cls:"flex-gap",st:{marginTop:"8px",gap:"8px"}},
        el("button",{cls:"sbtn success",st:{fontSize:".78rem"},onClick:async()=>{
          showConfirm("Approve this leave request for "+req.res.name+"?",async()=>{
            await approveLeaveRequest(req.id,req.res.id,req.from,req.to,req.days,req.comment);
          },"Approve","success");
        }},"Approve"),
        el("button",{cls:"sbtn danger",st:{fontSize:".78rem"},onClick:async()=>{
          const note=prompt("Rejection note (optional):");
          if(note===null)return;
          await rejectLeaveRequest(req.id,req.comment,note);
        }},"Reject")
      ):null
    );
  }

  // Rota leave row renderer
  function rotaRow(l){
    const bs=blockStartDate(l.period,CURRENT_ACADEMIC_YEAR);
    const days=l.partial?l.weeks*7:28;
    let fromDate,toDate;
    if(bs){
      if(!l.partial){fromDate=bs;toDate=new Date(bs.getTime()+27*86400000);}
      else if(l.position==="start"){fromDate=bs;toDate=new Date(bs.getTime()+(days-1)*86400000);}
      else{toDate=new Date(bs.getTime()+27*86400000);fromDate=new Date(toDate.getTime()-(days-1)*86400000);}
    }
    const fmt=d=>d?fmtDate(toLocalYMD(d)):"—";
    return el("div",{st:{padding:"12px",border:"1px solid rgba(164,122,40,.25)",borderRadius:"10px",marginBottom:"8px",background:"#fdf8ee"}},
      el("div",{cls:"flex-gap",st:{marginBottom:"6px",flexWrap:"wrap",gap:"8px"}},
        el("div",{cls:"flex-gap",st:{gap:"8px",alignItems:"center",flex:"1"}},
          avEl(l.res),
          el("div",null,
            el("div",{st:{fontWeight:"700",fontSize:".88rem"}},l.res.name),
            el("div",{cls:"sub"},l.res.level)
          )
        ),
        el("span",{cls:"bdg",st:{background:"rgba(164,122,40,.12)",color:"#7a5a10"}},"Rota Block "+l.period),
        el("span",{cls:"bdg",st:{background:"#FEFBF3",color:"#475569"}},days+"d"+(l.partial?" (partial)":""))
      ),
      bs?el("div",{st:{fontSize:".82rem",color:"#1F1A12",marginBottom:"8px"}}," "+fmt(fromDate)+" → "+fmt(toDate)):
        el("div",{cls:"sh",st:{marginBottom:"8px"}},"Dates unavailable for this block"),
      el("button",{cls:"sbtn success",st:{fontSize:".78rem"},onClick:async()=>{
        showConfirm("Approve rota leave Block "+l.period+" for "+l.res.name+"?",async()=>{
          if(!bs){showToast("Cannot compute dates for this block.","error");return;}
          const from=toLocalYMD(fromDate);
          const to=toLocalYMD(toDate);
          await addManualLeave(l.res.id,from,to,days,"Rota leave B"+l.period);
        },"Approve","success");
      }},"Approve")
    );
  }

  return el("div",null,
    rotaPending.length>0?el("div",{cls:"card",st:{marginBottom:"16px"}},
      el("div",{cls:"flex-gap",st:{marginBottom:"12px"}},
        el("span",{cls:"card-title",st:{margin:"0"}},"Rota-Detected Leave"),
        el("span",{cls:"bdg",st:{background:"rgba(164,122,40,.15)",color:"#7a5a10"}},rotaPending.length+" pending approval")
      ),
      el("div",{cls:"sh",st:{marginBottom:"12px",fontSize:".78rem"}},"Leave blocks detected from the master rota. Approve to formally record them."),
      el("div",null,...rotaPending.map(rotaRow))
    ):null,
    el("div",{cls:"card"},
      el("div",{cls:"flex-gap",st:{marginBottom:"12px"}},
        el("span",{cls:"card-title",st:{margin:"0"}},"Pending Leave Requests"),
        el("span",{cls:"bdg",st:{background:"#fef9c3",color:"#854d0e"}},pending.length+" pending")
      ),
      pending.length===0?el("p",{cls:"sh"},"No pending requests — all clear "):
      el("div",null,...pending.map(req=>reqRow(req,true)))
    ),
    rejected.length>0?el("div",{cls:"card"},
      el("div",{cls:"card-title"},"Rejected Requests"),
      el("div",{cls:"sh",st:{marginBottom:"10px",fontSize:".78rem"}},"Residents can see these in their Leave view."),
      ...rejected.map(req=>reqRow(req,false))
    ):null
  );
}
function renderLeaveDetail(rid,onBack){
  const res=resById(rid);
  if(!res)return el("div",null,"Not found");
  const ld=LEAVE_DATA[rid]||{rota:[],manual:[],absences:[],requests:[]};
  if(!LEAVE_DATA[rid])LEAVE_DATA[rid]={rota:[],manual:[],absences:[],requests:[]};
  // Quotas
  const ANNUAL_QUOTA=28;
  const EDU_QUOTA=7;
  // Split manual leaves into annual vs educational ([EDU] prefix in comment)
  const annualLeaves=ld.manual.filter(x=>x.approved&&!x.comment?.startsWith("[EDU]"));
  const eduLeaves=ld.manual.filter(x=>x.approved&&x.comment?.startsWith("[EDU]"));
  const annualApproved=annualLeaves.reduce((a,x)=>a+(x.days||0),0);
  const eduApproved=eduLeaves.reduce((a,x)=>a+(x.days||0),0);
  const absenceDays=ld.absences.reduce((a,x)=>a+(x.days||0),0);
  // Rota days that haven't been formally approved yet
  const approvedBlocks=new Set(ld.manual.map(m=>{const mt=m.comment?.match(/Rota leave B(\d+)/);return mt?parseInt(mt[1]):null;}).filter(Boolean));
  const rotaDays=ld.rota.reduce((a,l)=>a+(approvedBlocks.has(l.period)?0:(l.partial?l.weeks*7:28)),0);
  const totalUsedAnnual=annualApproved+rotaDays;

  const eduRemaining=EDU_QUOTA-eduApproved;

    const blockStart=blockStartDate(l.period,CURRENT_ACADEMIC_YEAR);

      el("div",{st:{flex:"1"}}),

      el("div",{cls:"grid-4",st:{gap:"10px"}},

          el("div",{cls:"statlbl"},"Annual Remaining"),
          el("div",{st:{fontSize:".65rem",color:"#94a3b8",marginTop:"2px"}},totalUsedAnnual+"/"+ANNUAL_QUOTA+" used")
        ),
        el("div",{cls:"statbox"},
          el("div",{cls:"statval",st:{color:eduRemaining<0?"#dc2626":"#7c3aed"}},eduRemaining),

// ─── PD OVERVIEW DASHBOARD ───────────────────────────────────────────────────
function renderPDOverview(){
  const kpiColor=v=>v>=80?"#26523A":v>=60?"#A47A28":"#dc2626";
  const filterLevel=STATE.ovLevel||"all";
  const sortBy=STATE.ovSort||"name";

  // ── Lazy-load all counseling in one shot if not yet done ──────────────────
  const anyUnloaded=RESIDENTS.some(r=>COUNSEL_CACHE[r.id]===undefined);
  if(anyUnloaded){
    RESIDENTS.forEach(r=>{if(COUNSEL_CACHE[r.id]===undefined)COUNSEL_CACHE[r.id]=null;});
    sb.from("counseling").select("*").order("date",{ascending:false}).then(({data})=>{
      const fresh={};
      (data||[]).forEach(rec=>{
        if(!fresh[rec.resident_id])fresh[rec.resident_id]=[];
        fresh[rec.resident_id].push(rec);
      });
      RESIDENTS.forEach(r=>{COUNSEL_CACHE[r.id]=fresh[r.id]||[];});
      set({});
    });
  }

  // ── Build rows ────────────────────────────────────────────────────────────
  let rows=RESIDENTS.map(r=>{
    const k=calcKPI(r.id);
    const cRecs=COUNSEL_CACHE[r.id];
    const counselCount=Array.isArray(cRecs)?cRecs.length:null;
    const atRisk=k.overall<60||(k.mmPct!=null&&k.mmPct<60)||(k.tPct!=null&&k.tPct<60);
    return{...r,k,counselCount,atRisk};
  });
  if(filterLevel!=="all")rows=rows.filter(r=>r.level===filterLevel);
  const sortRows={name:(a,b)=>a.name.localeCompare(b.name),level:(a,b)=>a.level.localeCompare(b.level)||a.name.localeCompare(b.name),kpi:(a,b)=>b.k.overall-a.k.overall,mm:(a,b)=>b.k.mmPct-a.k.mmPct,teach:(a,b)=>b.k.tPct-a.k.tPct,quiz:(a,b)=>b.k.qAvg-a.k.qAvg};
  rows.sort(sortRows[sortBy]||sortRows.name);

  // ── Summary stats ─────────────────────────────────────────────────────────
  const total=rows.length;
  const avgKPI=total?Math.round(rows.reduce((s,r)=>s+r.k.overall,0)/total):0;
  const atRiskCount=rows.filter(r=>r.atRisk).length;
  const withCounsel=rows.filter(r=>r.counselCount>0).length;

  function statCard(icon,label,val,color,sub){
    return el("div",{st:{flex:"1",minWidth:"130px",background:color+"0d",border:"1px solid "+color+"33",borderRadius:"14px",padding:"16px 14px",textAlign:"center"}},
      el("div",{st:{fontSize:"1.5rem",marginBottom:"4px"}},icon),
      el("div",{st:{fontSize:"1.55rem",fontWeight:"900",color,lineHeight:"1.1"}},val),
      el("div",{st:{fontSize:".8rem",fontWeight:"700",color:"#1F1A12",marginTop:"4px"}},label),
      sub?el("div",{cls:"sh",st:{fontSize:".72rem",marginTop:"2px"}},sub):null
    );
  }

  const summary=el("div",{st:{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:"12px",marginBottom:"24px"}},
    statCard("","Total Residents",total,"#c96a4a"),
    statCard("","Average KPI",avgKPI+"%",kpiColor(avgKPI)),
    statCard("","At Risk",atRiskCount,"#dc2626","KPI or attendance < 60%"),
    statCard("","With Counseling",withCounsel,"#A47A28","Active records")
  );

  // ── Filters ───────────────────────────────────────────────────────────────
  const filters=el("div",{st:{display:"flex",flexWrap:"wrap",gap:"8px",alignItems:"center",padding:"0 0 16px"}},
    el("span",{cls:"sh",st:{fontWeight:"700",marginRight:"2px"}},"Level:"),
    ...["all","R1","R2","R3","R4"].map(l=>
      el("span",{cls:"pill"+(filterLevel===l?" on":""),onClick:()=>set({ovLevel:l})},l==="all"?"All":l)
    ),
    el("span",{st:{flex:"1"}}),
    el("span",{cls:"sh",st:{fontWeight:"700",marginRight:"2px"}},"Sort:"),
    ...[["name","Name"],["level","Level"],["kpi","KPI ↓"],["mm","MM"],["teach","Teach"],["quiz","Quiz"]].map(([k,lbl])=>
      el("span",{cls:"pill"+(sortBy===k?" on":""),onClick:()=>set({ovSort:k})},lbl)
    )
  );

  // ── Level badge colors ────────────────────────────────────────────────────
  const lvlStyle={R1:{bg:"rgba(38,82,58,.12)",fg:"#26523A"},R2:{bg:"rgba(127,184,156,.15)",fg:"#26523A"},R3:{bg:"rgba(164,122,40,.12)",fg:"#6a4c10"},R4:{bg:"rgba(201,106,74,.12)",fg:"#A47A28"}};

  // ── Table ─────────────────────────────────────────────────────────────────
  function colH(label,key){
    return el("th",{
      st:{padding:"10px 12px",fontWeight:"700",fontSize:".74rem",textTransform:"uppercase",letterSpacing:".04em",color:"rgba(31,26,18,.42)",whiteSpace:"nowrap",cursor:"pointer",userSelect:"none",background:"#F6EFE2"},
      onClick:()=>set({ovSort:key})
    },label+(sortBy===key?" ↓":""));
  }
  function pctCell(val){
    const noData=val==null;
    const col=noData?"#9ca3af":kpiColor(val);
    return el("td",{st:{padding:"8px 10px",textAlign:"center"}},
      el("div",{st:{display:"flex",flexDirection:"column",alignItems:"center",gap:"3px"}},
        el("span",{st:{fontWeight:"700",fontSize:".86rem",color:col}},noData?"N/A":val+"%"),
        el("div",{st:{width:"48px",height:"4px",background:"rgba(31,26,18,.1)",borderRadius:"2px"}},
          el("div",{st:{width:Math.min(val||0,100)+"%",height:"100%",background:col,borderRadius:"2px"}})
        )
      )
    );
  }

  const thead=el("thead",null,
    el("tr",{st:{borderBottom:"2px solid #e2e8f0"}},
      colH("Resident","name"),colH("Level","level"),colH("KPI","kpi"),
      colH("MM Att.","mm"),colH("Academic Day","teach"),colH("Quiz","quiz"),
      el("th",{st:{padding:"10px 12px",fontWeight:"700",fontSize:".74rem",textTransform:"uppercase",color:"rgba(31,26,18,.42)",background:"#F6EFE2"}},"Counsel"),
      el("th",{st:{padding:"10px 12px",background:"#F6EFE2"}})
    )
  );

  const tbody=el("tbody",null,...rows.map((row,i)=>{
    const ls=lvlStyle[row.level]||{bg:"#FEFBF3",fg:"#1F1A12"};
    const cVal=row.counselCount===null?"…":row.counselCount===0?"—":String(row.counselCount);
    const cColor=row.counselCount>0?"#dc2626":"rgba(31,26,18,.42)";
    return el("tr",{
      st:{borderBottom:"1px solid #f1f5f9",cursor:"pointer",transition:"background .12s"},
      onMouseover:e=>e.currentTarget.style.background="#F6EFE2",
      onMouseout:e=>e.currentTarget.style.background="",
      onClick:()=>set({mod:"admin",adminProfile:row.id,adminResTab:"kpi"})
    },
      el("td",{st:{padding:"8px 12px"}},
        el("div",{st:{display:"flex",alignItems:"center",gap:"8px"}},
          el("div",{cls:"av",st:{width:"32px",height:"32px",fontSize:".7rem",flexShrink:"0"}},row.ph),
          el("div",null,
            el("div",{st:{fontWeight:"700",fontSize:".86rem",color:"#1F1A12"}},
              row.name,
              row.atRisk?el("span",{st:{marginLeft:"6px",fontSize:".7rem",color:"#dc2626",fontWeight:"800"}},"At Risk"):null
            ),
            el("div",{cls:"sh",st:{fontSize:".72rem"}},"Mentor: "+mentorName(row.id))
          )
        )

      el("td",{st:{padding:"8px 10px",textAlign:"center"}},
        el("span",{cls:"bdg",st:{background:ls.bg,color:ls.fg,fontSize:".75rem"}},row.level)
      ),
      el("td",{st:{padding:"8px 10px",textAlign:"center"}},
        el("div",{st:{display:"flex",flexDirection:"column",alignItems:"center",gap:"3px"}},
          el("span",{st:{fontWeight:"900",fontSize:".95rem",color:kpiColor(row.k.overall)}},row.k.overall+"%"),
          el("div",{st:{width:"54px",height:"6px",background:"rgba(31,26,18,.1)",borderRadius:"3px"}},

      el("td",{st:{padding:"8px 10px",textAlign:"right"}},
        el("span",{cls:"sh",st:{fontSize:".76rem"}},"View →")
      )
    );
  }));

  const table=el("table",{st:{width:"100%",borderCollapse:"collapse",fontSize:".84rem"}},thead,tbody);

  // ── At-risk highlight box ─────────────────────────────────────────────────
  const atRiskBox=atRiskCount>0?el("div",{cls:"alert-red",st:{marginBottom:"16px"}},
    el("div",{st:{fontWeight:"700",marginBottom:"4px"}},""+atRiskCount+" resident"+(atRiskCount>1?"s":"")+" at risk"),
    ...rows.filter(r=>r.atRisk).map(r=>{
      const flags=[];
      if(r.k.overall<60)flags.push("KPI "+r.k.overall+"%");
      if(r.k.mmPct!=null&&r.k.mmPct<60)flags.push("MM "+r.k.mmPct+"%");
      if(r.k.tPct!=null&&r.k.tPct<60)flags.push("Academic Day "+r.k.tPct+"%");
      return el("div",{st:{fontSize:".82rem",marginTop:"3px",cursor:"pointer"},onClick:()=>set({mod:"admin",adminProfile:r.id,adminResTab:"kpi"})}, "– "+r.name+" ("+r.level+") — "+flags.join(", ")+" → Click to view" );
    })
  ):null;

  const counselFlagged=rows.filter(r=>Array.isArray(COUNSEL_CACHE[r.id])&&COUNSEL_CACHE[r.id].length>=2);
  const counselBox=counselFlagged.length>0?el("div",{st:{marginBottom:"16px",background:"#fef9ec",border:"1px solid #f0d98a",borderRadius:"12px",padding:"14px 18px"}},

async function createLoginFor(kind,record){
  // kind: "resident" | "consultant" const{data:sess}=await sb.auth.getSession();
  const token=sess?.session?.access_token;
  if(!token){showToast("Your session expired — please sign in again.");return;}
  const{data,error}=await sb.functions.invoke(CREATE_LOGIN_FN,{
    body:{type:kind,recordId:record.id,username:record.user,displayName:record.name},
    headers:{Authorization:"Bearer "+token}
  });
  if(error){showToast("Could not create login: "+(error.message||error));return;}
  if(data?.error){showToast("Could not create login: "+data.error);return;}
  showInfoModal("Login Created — "+record.name,"Username: "+data.username+"\nTemporary password: "+data.password+"\n\nGive this to "+record.name+" and ask them to change their password after first sign-in (My Account button).");
  await loadCoreData();render();
}

// ─── ADMIN: IMPORT ROTA (Excel upload → parse → match → review → commit) ────
async function handleRotaFileSelected(file){
  try{
    const buf=await file.arrayBuffer();
    const wb=XLSX.read(buf,{type:"array"});
    ROTA_IMPORT.workbook=wb;
    ROTA_IMPORT.sheetNames=wb.SheetNames;
    ROTA_IMPORT.selectedSheet=wb.SheetNames[0];
    ROTA_IMPORT.fileName=file.name;
    render();
  }catch(e){
    showToast("Could not read that file: "+(e.message||e));
  }
}
function parseSelectedRotaSheet(){
  try{
    const wb=ROTA_IMPORT.workbook;
    const ws=wb.Sheets[ROTA_IMPORT.selectedSheet];
    const aoa=XLSX.utils.sheet_to_json(ws,{header:1,raw:false,defval:""});
    const parsed=parseRotaSheet(aoa);
    ROTA_IMPORT.blockCols=parsed.blockCols;
    ROTA_IMPORT.rows=parsed.residents.map(r=>{
      const{match,confidence}=matchResidentByName(r.name,RESIDENTS);
      const cells={};
      parsed.blockCols.forEach(b=>{cells[b]=classifyRotaCell(r.cells[b]);});
      return{excelRowIndex:r.rowIndex,excelName:r.name,excelLevel:r.level,matchedResidentId:match?match.id:null,matchConfidence:confidence,skip:false,cells};
    });
    set({rotaImportStep:2});
  }catch(e){
    showToast("Could not parse that sheet: "+(e.message||e));
  }
}
function rotaImportUnknownCells(){
  const list=[];
  ROTA_IMPORT.rows.forEach((row,ri)=>{
    if(row.skip)return;
    (ROTA_IMPORT.blockCols||[]).forEach(block=>{
      if((row.cells[block]||{}).type==="unknown")list.push({rowIdx:ri,block});
    });
  });
  return list;
}
function goToRotaImportStep3or4(){
  const unresolved=ROTA_IMPORT.rows.filter(r=>!r.skip&&!r.matchedResidentId);
  if(unresolved.length){showToast("Please match or skip every resident row before continuing ("+unresolved.length+" unresolved).","warning");return;}
  const unknown=rotaImportUnknownCells();
  set({rotaImportStep:unknown.length?3:4});
}
function applyUnknownCellChoice(rowIdx,block,choice){
  const row=ROTA_IMPORT.rows[rowIdx];
  if(choice==="__skip__")row.cells[block]={type:"empty"};
  else if(choice==="__literal__"){/* keep as-is — already classified "unknown" with the raw text preserved */}
  else if(choice==="Annual Leave")row.cells[block]={type:"leave",kind:"annual",rotationName:"Annual Leave"};
  else if(choice==="Maternity Leave")row.cells[block]={type:"leave",kind:"maternity",rotationName:"Maternity Leave"};
  else row.cells[block]={type:"rotation",rotationName:choice};
  render();
}
function resetRotaImport(){
  ROTA_IMPORT={workbook:null,sheetNames:[],rows:[],blockCols:[],academicYear:CURRENT_ACADEMIC_YEAR};
  set({rotaImportStep:1});
}
function rotaImportSummary(){
  const s={residents:0,rotation:0,leaveAnnual:0,leaveMaternity:0,split:0,dualRotation:0,literalUnknown:0,skippedCells:0,skippedRows:0};
  ROTA_IMPORT.rows.forEach(row=>{
    if(row.skip||!row.matchedResidentId){s.skippedRows++;return;}
    s.residents++;
    (ROTA_IMPORT.blockCols||[]).forEach(block=>{
      const c=row.cells[block]||{type:"empty"};
      if(c.type==="empty")s.skippedCells++;
      else if(c.type==="rotation")s.rotation++;
      else if(c.type==="dual_rotation")s.dualRotation++;
      else if(c.type==="leave"&&c.kind==="maternity")s.leaveMaternity++;
      else if(c.type==="leave")s.leaveAnnual++;
      else if(c.type==="split")s.split++;
      else if(c.type==="unknown")s.literalUnknown++;
    });
  });
  return s;
}
async function commitRotaImport(){
  const entries=[];
  ROTA_IMPORT.rows.forEach(row=>{
    if(row.skip||!row.matchedResidentId)return;
    (ROTA_IMPORT.blockCols||[]).forEach(block=>{
      const c=row.cells[block]||{type:"empty"};
      if(c.type==="empty")return;
      if(c.type==="dual_rotation"){
        // Store as "RotA / RotB" — 2 weeks of each rotation in the block, no leave
        entries.push({residentId:row.matchedResidentId,block,rotationName:c.rotationName+" / "+c.rotationName2,leaveWeeks:0,leavePosition:"none"});
      }else{
        entries.push({residentId:row.matchedResidentId,block,rotationName:c.rotationName,leaveWeeks:c.weeks||0,leavePosition:c.position||"none"});
      }
    });
  });
  if(!entries.length){showToast("Nothing to import — no matched residents with rota cells to write.","warning");return;}
  // Check for leave conflicts before committing
  const conflicts=[];
  entries.forEach(e=>{
    const blockStart=blockStartDate(e.block-1,CURRENT_ACADEMIC_YEAR);
    if(!blockStart)return;
    const blockEnd=new Date(blockStart.getTime()+27*86400000);
    const bFrom=blockStart.getFullYear()+"-"+String(blockStart.getMonth()+1).padStart(2,"0")+"-"+String(blockStart.getDate()).padStart(2,"0");
    const bTo=blockEnd.getFullYear()+"-"+String(blockEnd.getMonth()+1).padStart(2,"0")+"-"+String(blockEnd.getDate()).padStart(2,"0");
    const approved=(LEAVE_DATA[e.residentId]?.manual||[]).filter(l=>l.approved);
    if(approved.some(l=>bFrom<=l.to_date&&l.from_date<=bTo)){
      const res=resById(e.residentId);
      conflicts.push((res?.name||"ID "+e.residentId)+" — Block "+e.block);
    }
  });
  if(conflicts.length){
    showConfirm("Warning: "+conflicts.length+" assignment"+(conflicts.length>1?"s overlap":"  overlaps")+" with existing approved leave:\n\n"+conflicts.join("\n")+"\n\nCommit anyway?",async()=>{const ok=await saveRotaCells(entries);if(ok)set({rotaImportStep:5});},  "Commit Anyway","sbtn danger");
    return;
  }
  const ok=await saveRotaCells(entries);
  if(ok)set({rotaImportStep:5});
}

      function tick(){
        const m2=Math.max(0,new Date(qEnd)-new Date());
        const d2=Math.floor(m2/86400000);

          el("div",{st:{fontSize:"22px"}},""),
          el("div",null,
            el("div",{st:{fontFamily:"sans-serif",fontSize:"13px",fontWeight:"800",color:"#3d2b1f"}},"Best Senior Resident"),
            el("div",{st:{fontFamily:"sans-serif",fontSize:"10px",color:"#9a8060",marginTop:"2px"}},"To be announced")
          )
        ),
        el("div",{cls:"cdb-pending-card",st:{cursor:"pointer"},onClick:()=>set({mod:"best_resident",brTab:"vote"})},
          el("div",{st:{fontSize:"22px"}},""),
          el("div",null,
            el("div",{st:{fontFamily:"sans-serif",fontSize:"13px",fontWeight:"800",color:"#3d2b1f"}},"Best Junior Resident"),
            el("div",{st:{fontFamily:"sans-serif",fontSize:"10px",color:"#9a8060",marginTop:"2px"}},"To be announced")
          )
        )
      )
    );
  }

  const votingStrip=isOpen?el("div",{cls:"stars-voting-strip"},
    el("div",{cls:"vote-pulse-dot"}),
    el("div",{cls:"vote-strip-text"},
      el("strong",null,"Voting is open! "), "Cast your vote for Best Senior and Best Junior — counts 50% of the final score." ),
    cd?el("div",{cls:"vote-strip-cd"},cd):null,
    el("button",{cls:"sbtn primary",st:{fontSize:".78rem",padding:"5px 12px"},onClick:()=>set({mod:"best_resident",brTab:"vote"})},"Vote →")
  ):null;

  return el("div",{cls:"stars-banner"},
    spark({left:"12%",top:"30%"}),spark({left:"27%",top:"65%",width:"4px",height:"4px",background:"#e8a000",animationDelay:".8s"}),
    spark({left:"45%",top:"20%",animationDelay:"1.5s"}),spark({right:"18%",top:"40%",animationDelay:".3s"}),
    header,cardsEl,votingStrip

}

  function matrixTab(){
    const allRes=sortByLevel(RESIDENTS);
    const subRes=allRes.filter(r=>LEAVE_PLAN[r.id]?.status==="submitted");
    const missing=allRes.filter(r=>!LEAVE_PLAN[r.id]||LEAVE_PLAN[r.id].status!=="submitted");
    const counts=lpPeriodCounts();
    const overCap=LP_PERIODS.filter(p=>counts[p.key]>lpCapFor(p)).length;
    const bulkPending=lpBulkApprovable().pending;
    const bulkLeaves=bulkPending.reduce((s,x)=>s+x.which.length,0);

    const myLevel=resById(u.rid)?.level;
    const leaveStarted=!!(fk||sk);
    const leaveStatusLabel=submitted?"SUBMITTED":leaveStarted?"DRAFT":"NOT STARTED";
    const leaveStatusColors=submitted?{bg:"#e6f4ea",c:"#1e7a43"}:leaveStarted?{bg:"#fef3d6",c:"#92680a"}:{bg:"rgba(31,26,18,.06)",c:"rgba(31,26,18,.4)"};
    const leaveDesc=leaveStarted
      ?el("div",null,
          el("div",null,"First Leave: "+(fp?fp.label.replace(" - "," — "):"not selected")),
          el("div",{st:{marginTop:"2px"}},"Second Leave: "+(sp?sp.label.replace(" - "," — "):"not selected"))
        )
      :"Select your two 2-week leave periods for AY 2026-27.";

    const gimPlan=GIM_PREFS[u.rid]||null;
    const required=gimSlotCount(myLevel);
    const gimNotApplicable=myLevel==="R4";
    const gimOpen=gimIsOpen();

    const r4Locked=isR3ForR4&&!r4Open;

    function cardPriority(statusLabel,locked){
      const s=statusLabel.toUpperCase();
      if(s.includes("NOMINATING")||s.includes("NOMINATIONS OPEN")||s.includes("VOTING"))return 1;
      if(s==="MANAGE")return 1;

      if(s.includes("SUBMITTED"))return 3;
      if(s.includes("CLOSED")||s.includes("OPENS SOON")||s.includes("NOT CONFIGURED")||s.includes("NOT APPLICABLE"))return 5;

    const allCards=[];
    allCards.push({pri:cardPriority(leaveStatusLabel,false),el:card({icon:ayIcon('<rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/>',"#c96a4a"),

      onClick:()=>set({ayCard:"leave"})})});
    allCards.push({pri:cardPriority(gimStatusLabel,gimLocked),el:card({icon:ayIcon('<path d="m17 2 4 4-4 4"/><path d="M3 11v-1a4 4 0 0 1 4-4h14"/><path d="m7 22-4-4 4-4"/><path d="M21 13v1a4 4 0 0 1-4 4H3"/>',"#26523A"),

      iconBg:"rgba(26,86,219,.1)",title:"Chief Resident Election",status:chiefPL.label,statusColors:chiefPL.colors,desc:chiefDesc,
      onClick:()=>set({ayCard:"chief"})})});
    if(showR4Card){

        iconBg:"rgba(164,122,40,.1)",title:"R4 Rotation Preferences",status:r4StatusLabel,statusColors:r4StatusColors,desc:r4Desc,locked:r4Locked,

    }
    if(canBuildRota()){
      allCards.push({pri:1,el:card({icon:ayIcon('<rect x="3" y="3" width="18" height="18" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="9" y1="9" x2="9" y2="21"/><line x1="15" y1="9" x2="15" y2="21"/>',"#7a3f8f"),
        iconBg:"rgba(122,63,143,.1)",title:"Master Rota Builder",status:"MANAGE",statusColors:{bg:"rgba(122,63,143,.1)",c:"#7a3f8f"},
        desc:"Lay out all 13 blocks for every resident, block by block, against their leave, GIM and elective preferences. Publish one block at a time.",
        onClick:()=>set({ayCard:"rota"})})});
    }
    allCards.sort((a,b)=>a.pri-b.pri);

    const cards=el("div",{st:{display:"flex",gap:"18px",marginTop:"24px",flexWrap:"wrap"}});
    allCards.forEach(c=>cards.appendChild(c.el));
    return cards;
  }

  function gimSection(){

    function toggleBlock(b){
      if(leaveBlocks.has(b))return;

      if(sel.length>=required){showToast("You can only select "+required+" block"+(required===1?"":"s")+". Deselect one first.","error");return;}
      set({gimBlocks:[...sel,b]});

          onClick:async()=>saveGimPrefs("draft")},"Save Draft"),

      }
      const setupPanel=el("div",{st:{background:"#fff8e6",border:"1.5px solid #f0d98a",borderRadius:"14px",padding:"20px",marginBottom:"24px"}},
        el("div",{st:{fontWeight:"700",fontSize:".88rem",color:"#92680a",marginBottom:"14px"}},"Election Configuration"),
        el("div",{st:{display:"flex",gap:"12px",flexWrap:"wrap",marginBottom:"10px"}},
          dtField("Nomination Opens","ceNomStart"),dtField("Nomination Closes","ceNomEnd")),
        el("div",{st:{display:"flex",gap:"12px",flexWrap:"wrap",marginBottom:"14px"}},
          dtField("Voting Opens","ceVoteStart"),dtField("Voting Closes","ceVoteEnd")),
        el("div",{st:{display:"flex",justifyContent:"flex-end"}},

            async onClick(){

              if(new Date(ve)<=new Date(vs)){showToast("Voting end must be after start","error");return;}
              await saveChiefElection(new Date(ns).toISOString(),new Date(ne).toISOString(),new Date(vs).toISOString(),new Date(ve).toISOString());
            }},CHIEF_ELECTION?"Update Election":"Create Election"))
      );
      sec.appendChild(setupPanel);
    }
    const pl=chiefPhaseLabel();

    if(published&&snap){

        const banner=el("div",{st:{position:"relative",overflow:"hidden",borderRadius:"18px",padding:"34px 30px 32px",textAlign:"center",color:"#FEFBF3",marginBottom:"6px",background:"linear-gradient(135deg,#7c3a20 0%,#c96a4a 55%,#e8956d 100%)"}},
          el("div",{st:{fontSize:".68rem",fontWeight:"700",letterSpacing:".15em",textTransform:"uppercase",opacity:".8",marginBottom:"20px",lineHeight:"1.5"}},"Chief Resident for AY 2026-27 is"),
          el("div",{st:{display:"inline-block",position:"relative",marginBottom:"16px"}},
            el("div",{st:{width:"84px",height:"84px",borderRadius:"50%",background:"rgba(254,251,243,.16)",border:"2.5px solid rgba(254,251,243,.5)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:"1.5rem",fontWeight:"700"}},ini(win.name)),
            el("div",{st:{position:"absolute",bottom:"-4px",right:"-6px",width:"32px",height:"32px",borderRadius:"50%",background:"#FEFBF3",display:"flex",alignItems:"center",justifyContent:"center",boxShadow:"0 2px 8px rgba(31,26,18,.2)"}},modIcon("trophy",17))),
          el("div",{st:{fontFamily:"'Playfair Display',serif",fontSize:"2rem",fontWeight:"700",lineHeight:"1.15",marginBottom:"6px"}},dname(win.name)),
          el("div",{st:{fontSize:".8rem",opacity:".78",marginBottom:"20px"}},win.level+" \u00b7 Internal Medicine"),
          el("div",{st:{width:"44px",height:"2px",background:"rgba(254,251,243,.4)",margin:"0 auto 18px",borderRadius:"2px"}}),
          el("div",{st:{fontSize:".74rem",fontWeight:"600",letterSpacing:".1em",textTransform:"uppercase",opacity:".9"}},"Elected Chief Resident"));
        sec.appendChild(banner);

    }
    if(phase==="closed"&&canSetup){
      if(!published){
        sec.appendChild(el("div",{st:{background:"#fff8e6",border:"1.5px solid #f0d98a",borderRadius:"14px",padding:"20px",marginBottom:"18px"}},
          el("div",{st:{fontWeight:"700",fontSize:".82rem",color:"#92680a",marginBottom:"6px"}},"Results are not published yet"),
          el("div",{st:{fontSize:".78rem",color:"rgba(31,26,18,.55)",lineHeight:"1.55",marginBottom:"14px"}},"Only you and the chief can see the tally. Publishing shows the winner and the full vote count to every resident, and sends them a notification."),

      if(canNominate&&!isNominated){

// ─── MASTER ROTA BUILDER ──────────────────────────────────────────────────────
const RB_MANDATORY_TOTAL=MANDATORY.reduce((s,m)=>s+SCFHS_TOTAL[m],0);
// Rotations that carry no SCFHS minimum: service time, clinic, elective and leave.
const RB_EXTRA=["Night Duty","Medical Consult","Outpatient Clinic","Elective","Annual Leave","Maternity Leave"];
// A resident's two leave picks can both land in the same block, which makes the whole
// block leave. Only an approved pick prefills the builder — a merely suggested one is
// left for the PD to approve first, and the rail already shows it as pending.
function rbApprovedLeave(rid,blk){
  const lp=LEAVE_PLAN[rid];
  if(!lp)return null;
  const hits=[];
  ["first","second"].forEach(w=>{
    if(!lp[w+"_leave_approved"])return;
    const p=LP_PERIODS.find(x=>x.key===lp[w+"_leave_key"]);
    if(p&&p.blk===blk)hits.push({which:w,period:p});
  });
  if(!hits.length)return null;
  return{mode:hits.length>1?"whole":(hits[0].period.half==="first"?"start":"end"),hits};
}
// A leave period is two weeks and never stretches to fill a longer block — the rotation
// side absorbs any extra week. bw-1 keeps at least one week of rotation to hang it on.
function rbLeaveWeeks(mode,bw){return(mode==="start"||mode==="end")?Math.min(2,bw-1):0;}
// The R4 picks name a block each, so they map straight onto a cell. Both rotation names
// already exist in RB_EXTRA; the subspecialty and location stay in the rail as reference,
// since a rota cell can only carry a rotation name.
function rbPrefillR4(rid,blk){
  const p=R4_PREFS[rid];
  if(!p||p.status!=="submitted")return null;
  if(p.elective1_block===blk||p.elective2_block===blk)return{rot:"Elective",src:"elective"};
  if(p.clinic1_block===blk||p.clinic2_block===blk)return{rot:"Outpatient Clinic",src:"clinic"};
  return null;
}
function rbPlanRoster(){return allRoster().filter(r=>planLevel(r));}
// Works out every cell the prefill would write without touching the database, so the
// confirm dialog can show real counts and the save can replay the identical result.
// Approved leave is binding and the R4 picks are only preferences, so leave always wins
// where the two collide — and a block holding approved leave is left untouched entirely
// when leave is not being imported, rather than having a rotation written across it.
function rbPrefillPlan(src){
  const fills=[],counts={leave:0,elective:0,clinic:0};
  const skip={planned:0,locked:0,displaced:0,leaveHold:0};
  let shared=0;
  rbPlanRoster().forEach(r=>{
    rotaPeriods(PLAN_AY).forEach((_,i)=>{
      const blk=i+1;
      const lv=rbApprovedLeave(r.id,blk);
      const r4=rbPrefillR4(r.id,blk);
      const pick=(r4&&src[r4.src])?r4:null;
      if(lv&&!src.leave){if(pick)skip.leaveHold++;return;}
      if(!lv&&!pick)return;
      if(((ROTA_PLAN[r.id]||{})[String(blk)]||[]).length){skip.planned++;return;}
      if(!planBlockEditable(blk)){skip.locked++;return;}
      const bw=blockWeeks(blk,PLAN_AY),lw=rbLeaveWeeks(lv?lv.mode:"none",bw);
      let segs;
      if(lv&&lv.mode==="whole"){
        segs=[{weekStart:1,weeks:bw,rot:"Annual Leave"}];
        counts.leave++;if(pick)skip.displaced++;
      }else if(lv&&pick){
        segs=lv.mode==="start"
          ?[{weekStart:1,weeks:lw,rot:"Annual Leave"},{weekStart:lw+1,weeks:bw-lw,rot:pick.rot}]
          :[{weekStart:1,weeks:bw-lw,rot:pick.rot},{weekStart:bw-lw+1,weeks:lw,rot:"Annual Leave"}];
        counts.leave++;counts[pick.src]++;shared++;
      }else if(lv){
        // A bare half-block leave has no rotation to hang leave_weeks on — savePlanCell drops
        // any segment without one — so it is written as a two-week Annual Leave segment and
        // the other half is left open for the chief to fill.
        segs=[{weekStart:lv.mode==="start"?1:bw-lw+1,weeks:lw,rot:"Annual Leave"}];
        counts.leave++;
      }else{
        segs=[{weekStart:1,weeks:bw,rot:pick.rot}];
        counts[pick.src]++;
      }
      fills.push({rid:r.id,blk,segs});
    });
  });
  return{fills,counts,skip,shared};
}
async function rbRunPrefill(){
  const{fills}=rbPrefillPlan(STATE.rbPfSrc||{leave:true,elective:true,clinic:true});
  const rows=[];
  fills.forEach(f=>f.segs.forEach((s,i)=>rows.push({
    resident_id:f.rid,academic_year:PLAN_AY,block_number:f.blk,
    segment:i+1,week_start:s.weekStart,weeks:s.weeks,
    rotation_name:s.rot,leave_weeks:0,leave_position:"none",
    updated_by:STATE.user?.profileId||null,updated_at:new Date().toISOString()
  })));
  if(!rows.length)return;
  // Every cell here was empty, so there is nothing to delete first and the whole prefill
  // goes in as one insert rather than one round trip per cell.
  const{error}=await sb.from("rota_plan").insert(rows);
  if(error){showToast("Could not prefill: "+error.message,"error");return;}
  STATE.rbPrefill=false;
  await loadRotaPlan();
  showToast("Filled "+fills.length+" cell"+(fills.length===1?"":"s"),"success");
}
function rbPrefillModal(){
  const src=STATE.rbPfSrc||{leave:true,elective:true,clinic:true};
  const{fills,counts,skip,shared}=rbPrefillPlan(src);
  const rowDef=[
    ["leave","Approved annual leave","Only leave the PD has approved — a suggested one is left alone."],
    ["elective","R4 electives → Elective","From submitted R4 preferences."],
    ["clinic","R4 clinics → Outpatient Clinic","From submitted R4 preferences."]];
  const tally=el("div",{cls:"tally"});
  rowDef.forEach(([k,lb,sub])=>{
    tally.appendChild(el("label",{cls:"ck"},

        onChange:()=>set({rbPfSrc:Object.assign({},src,{[k]:!src[k]})})}),
      el("span",{cls:"lb"},lb,el("span",{cls:"sub"},sub)),
      el("span",{cls:"n"},String(counts[k]))));
  });
  const notes=[],s=n=>n===1?"":"s";
  if(skip.planned)notes.push(skip.planned+" cell"+s(skip.planned)+" skipped — already planned.");
  if(skip.locked)notes.push(skip.locked+" skipped — the block is no longer editable.");
  if(skip.leaveHold)notes.push(skip.leaveHold+" R4 pick"+s(skip.leaveHold)+" held back — that block has approved leave.");
  if(skip.displaced)notes.push(skip.displaced+" R4 pick"+s(skip.displaced)+" dropped — the whole block is leave.");
  if(shared)notes.push(shared+" cell"+s(shared)+(shared===1?" takes":" take")+" leave and an R4 pick together, so the counts above overlap.");
  return el("div",{cls:"rb-pfov",onClick:e=>{if(e.target.classList.contains("rb-pfov"))set({rbPrefill:false});}},
    el("div",{cls:"rb-pf"},
      el("div",{cls:"ct"},"Prefill the grid"),
      el("p",{cls:"cb"},"Fills empty cells in the ",ayLabel(PLAN_AY)," draft from plans that are already ",
        el("b",null,"approved"),". Cells you have already planned are never overwritten."),
      tally,
      el("div",{cls:"sum"},el("span",{cls:"big"},String(fills.length)),
        el("span",{cls:"lbl"},"cell"+(fills.length===1?"":"s")+" will be filled")),

      el("div",{cls:"cbtns"},
        el("button",{cls:"sbtn ghost",onClick:()=>set({rbPrefill:false})},"Cancel"),
        el("button",{cls:"sbtn primary",disabled:!fills.length,onClick:rbRunPrefill},
          fills.length?"Prefill "+fills.length+" cell"+(fills.length===1?"":"s"):"Nothing to fill"))));
}
function rbOpenCell(rid,blk){
  const segs=(ROTA_PLAN[rid]||{})[String(blk)]||[];
  const bw=blockWeeks(blk,PLAN_AY);
  const savedLv=segs.find(s=>s.leaveWeeks>0);
  // Only an unplanned cell takes the leave plan's default, so switching the leave off
  // and saving sticks instead of springing back every time the cell is reopened.
  const appr=segs.length?null:rbApprovedLeave(rid,blk);
  // Boundary = how many weeks the first rotation runs; equal to the block length means the
  // block is not split at all. Whole-block leave is carried as the rotation itself, not as
  // leave weeks — the DB write drops any segment with no rotation name, so bare leave has
  // nothing to sit on.
  let bound=bw;
  const rots=[appr&&appr.mode==="whole"?"Annual Leave":(segs[0]?.rot||""),segs[1]?.rot||""];
  if(segs.length>1)bound=segs[0].weeks;
  else if(segs.length===1){
    // A lone segment covering only part of the block — one half filled in on its own, which
    // is what a prefilled leave looks like — has to keep the half it was saved in. Reading
    // it as a whole-block rotation would stretch it over the empty half on the next save.
    const s=segs[0],span=s.weeks+(s.leaveWeeks||0);
    if(s.weekStart>1){bound=s.weekStart-1;rots[0]="";rots[1]=s.rot;}
    else if(span<bw)bound=span;
  }
  set({rbCell:{rid,blk},rbBound:bound,rbSeg:0,rbRots:rots,
    rbLv:savedLv?savedLv.leavePos:(appr&&appr.mode!=="whole"?appr.mode:"none")});
}
function rbSegments(){
  const{blk}=STATE.rbCell,bw=blockWeeks(blk,PLAN_AY),b=STATE.rbBound,rots=STATE.rbRots||["",""];
  // Leave takes its weeks out of the single rotation beside it, so a block cannot be
  // split and carry a half-block leave at once — 4 weeks will not divide into 2 weeks
  // of leave plus two rotations.
  const lw=rbLeaveWeeks(STATE.rbLv,bw);
  if(lw)return rots[0]?[{weekStart:1,weeks:bw-lw,rot:rots[0],leaveWeeks:lw,leavePos:STATE.rbLv}]:[];
  if(b>=bw)return rots[0]?[{weekStart:1,weeks:bw,rot:rots[0],leaveWeeks:0,leavePos:"none"}]:[];
  const out=[];
  if(rots[0])out.push({weekStart:1,weeks:b,rot:rots[0],leaveWeeks:0,leavePos:"none"});
  if(rots[1])out.push({weekStart:b+1,weeks:bw-b,rot:rots[1],leaveWeeks:0,leavePos:"none"});
  return out;
}
async function rbSaveCell(){
  const{rid,blk}=STATE.rbCell;
  if(await savePlanCell(rid,blk,rbSegments())){showToast("Saved to the plan.","success");set({rbCell:null});}
}

    el("h1",{st:{fontFamily:"'Playfair Display',serif",fontSize:"2.1rem",fontWeight:"400",lineHeight:"1.1",color:"#FEFBF3",margin:"2px 0 4px"}},"Master Rota"),
    el("div",{st:{fontSize:".82rem",color:"rgba(254,251,243,.72)"}},

  ));

const RB_MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
// "4 Oct 2026", or with `end`, the block's last day. The end year is taken from the start
// and only rolls forward when the block itself crosses new year (block 4 is 27/12-23/1).
// A month threshold cannot do this: AY 2026-27 both opens and closes in October.
function fmtBlockRange(blk,ay,end){
  const s=blockStartDate(blk,ay);if(!s)return "";
  if(!end)return s.getDate()+" "+RB_MON[s.getMonth()]+" "+s.getFullYear();
  const[d,m]=String((rotaPeriods(ay)[blk-1]||"").split("-")[1]||"").split("/").map(Number);
  if(!d||!m)return "";
  return d+" "+RB_MON[m-1]+" "+(s.getFullYear()+(m<s.getMonth()+1?1:0));
}

function renderBrDetailModal(){
  const res=resById(STATE.brDetailRid);
  const close=()=>set({brDetailRid:null});
  if(!res)return null;
  const k=calcKPI(res.id);
  const col=(res.level==="R3"||res.level==="R4")?"senior":"junior";
  const votes=brVoteCountFor(res.id,col);
  const totalVoters=brTotalVoters();
  const votePct=totalVoters>0?Math.round(votes/totalVoters*100):0;
  const kpi=kpiOngoingScore(res.id);
  const final=Math.round(kpi*0.5+votePct*0.5);
  const kpiColor=v=>v>=80?"#26523A":v>=60?"#A47A28":"#dc2626";
  const rows=[
    {label:"Quiz Average",val:k.qAvg,w:KPI_W.quiz,sub:QUIZZES.filter(q=>q.published&&q.sc[res.id]!=null).length+" quizzes"},
    {label:"MM Attendance",val:k.mmPct,w:KPI_W.mm,sub:k.mmAtt+"/"+k.mmTotal+" sessions"},
    {label:"Academic Day Attendance",val:k.tPct,w:KPI_W.teach,sub:k.tAtt+"/"+k.tTotal+" sessions"},
    {label:"Presenter / Moderator",val:k.pres?100:0,w:KPI_W.pres,sub:k.presCount+" session"+(k.presCount!==1?"s":"")},
  ];
  return el("div",{cls:"modal-overlay",onClick:e=>{if(e.target===e.currentTarget)close();}},
    el("div",{cls:"modal-card",st:{width:"460px",maxWidth:"100%",position:"relative"}},
      el("button",{cls:"modal-close",onClick:close,st:{position:"absolute",top:"14px",right:"14px",border:"none",background:"none",fontSize:"1.3rem",lineHeight:"1",cursor:"pointer",color:"rgba(31,26,18,.4)"}},"×"),
      el("div",{st:{display:"flex",alignItems:"center",gap:"12px",marginBottom:"18px"}},
        el("div",{cls:"br-rank-av "+(col==="senior"?"snr":"jnr"),st:{width:"44px",height:"44px",fontSize:"1rem"}},ini(res.name)),
        el("div",null,
          el("h3",{st:{margin:"0"}},dname(res.name)),

      el("div",{st:{fontSize:".68rem",fontWeight:"700",textTransform:"uppercase",letterSpacing:".08em",color:"rgba(31,26,18,.35)",marginBottom:"8px"}},"KPI Ongoing Score — "+kpi+"%"),
      ...rows.map(r=>el("div",{st:{marginBottom:"10px"}},
        el("div",{st:{display:"flex",justifyContent:"space-between",fontSize:".82rem",marginBottom:"3px"}},
          el("span",null,r.label+" ("+r.w+"% weight)"),
          el("span",{st:{fontWeight:"700",color:r.val==null?"#9ca3af":kpiColor(r.val)}},r.val==null?"N/A":r.val+"%")
        ),

        el("div",{st:{background:"rgba(31,26,18,.08)",borderRadius:"4px",height:"6px"}},

        )

    +'<div class="wrap"><div class="sec-head reveal"><div class="lbl" style="color:var(--terracotta);">Cohort-Wide</div><h2>KPI Summary</h2></div>'
    +'<div class="horizon-wrap"><div class="horizon-svg-wrap" id="kpix-hzWrap">'+hzLegendHtml+hzBadgeHtml+hzSvg+'</div></div>'
    +'</div></section>'

    // Drilldown
    +drilldownHtml

    // Footer
    +'<section class="kpix-footer">'
    +'<div class="f-line"></div>'
    +'<div class="f-text">DSFH Internal Medicine Residency Program \u00B7 Performance Report \u00B7 AY '+selYear+'</div>'
    +'</section>';

  // ── Attach event listeners ──
  // Podium card clicks
  setTimeout(function(){
    var podCards=wrap.querySelectorAll(".pod-card[data-rid]");
    podCards.forEach(function(card){
      card.addEventListener("click",function(){
        var rid=card.dataset.rid;
        set({kpiExResident:rid});
        setTimeout(function(){var drEl=document.getElementById("kpix-drilldown");if(drEl)drEl.scrollIntoView({behavior:"smooth"});},60);
      });
    });
    // Back button
    var backBtn=wrap.querySelector("#kpix-drill-back");
    if(backBtn){
      backBtn.addEventListener("click",function(){
        set({kpiExResident:null});
        setTimeout(function(){var podEl=document.getElementById("kpix-podium");if(podEl)podEl.scrollIntoView({behavior:"smooth"});},60);
      });
    }
    // Nav dots smooth scroll
    var navDots=wrap.querySelectorAll("#kpix-navdots a");
    navDots.forEach(function(dot){
      dot.addEventListener("click",function(e){
        e.preventDefault();
        var href=dot.getAttribute("href");
        var target=wrap.querySelector(href);
        if(target) target.scrollIntoView({behavior:"smooth"});
      });
    });
  },0);

  // ── Initialize GSAP + ScrollTrigger ──
  setTimeout(function(){
    if(typeof gsap==="undefined"||typeof ScrollTrigger==="undefined") return;
    gsap.registerPlugin(ScrollTrigger);

    // Find the scroll container (.main-area)
    var scroller=wrap.closest(".main-area");
    if(!scroller) scroller=wrap.parentElement;
    var useScroller=scroller||undefined;

    // Register scrollerProxy — GSAP can't auto-detect scroll on a div scroller
    if(scroller){
      ScrollTrigger.scrollerProxy(scroller,{
        scrollTop:function(value){
          if(arguments.length){scroller.scrollTop=value;}
          return scroller.scrollTop;
        },
        getBoundingClientRect:function(){
          return scroller.getBoundingClientRect();
        }
      });
      // Update ScrollTrigger on every scroll event
      scroller.addEventListener("scroll",function(){ScrollTrigger.update();});
      // Belt-and-suspenders: also poll on GSAP ticker in case scroll events miss
      var _lastST=-1;
      gsap.ticker.add(function(){
        var s=scroller.scrollTop;
        if(s!==_lastST){_lastST=s;ScrollTrigger.update();}
      });
    }

    var prefersReducedMotion=window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    function D(sec){return prefersReducedMotion?Math.min(sec,.3):sec;}
    function E(ease){return prefersReducedMotion?"power1.out":ease;}

    // ── Confetti system ──
    var confettiCanvas=wrap.querySelector("#kpix-confetti");
    var confCtx=confettiCanvas?confettiCanvas.getContext("2d"):null;
    var confettiParticles=[];
    var CONFETTI_COLORS=["#c96a4a","#CBA155","#7FB89C","#e8956d","#A47A28","#fdf8f3"];

    function sizeCanvas(){
      if(!confettiCanvas||!confettiCanvas.parentElement) return;
      var parent=confettiCanvas.parentElement;
      confettiCanvas.width=parent.offsetWidth*(window.devicePixelRatio||1);
      confettiCanvas.height=parent.offsetHeight*(window.devicePixelRatio||1);
      confettiCanvas.style.width=parent.offsetWidth+"px";
      confettiCanvas.style.height=parent.offsetHeight+"px";
      if(confCtx) confCtx.setTransform(window.devicePixelRatio||1,0,0,window.devicePixelRatio||1,0,0);
    }
    sizeCanvas();
    window.addEventListener("resize",sizeCanvas);

    function burstConfetti(x,y,count){
      count=count||150;
      for(var i=0;i<count;i++){
        var angle=Math.random()*Math.PI*2;
        var speed=2+Math.random()*7;
        confettiParticles.push({x:x,y:y,vx:Math.cos(angle)*speed,vy:Math.sin(angle)*speed-3,size:4+Math.random()*5,color:CONFETTI_COLORS[Math.floor(Math.random()*CONFETTI_COLORS.length)],rot:Math.random()*360,vrot:(Math.random()-.5)*14,life:1});
      }
    }
    var confettiRunning=false;
    function tickConfetti(){
      if(!confettiParticles.length){confettiRunning=false;return;}
      confettiRunning=true;
      confettiParticles.forEach(function(p){
        p.vy+=0.12;p.x+=p.vx;p.y+=p.vy;p.rot+=p.vrot;p.life-=0.012;
        if(!confCtx)return;
        confCtx.save();confCtx.globalAlpha=Math.max(p.life,0);
        confCtx.translate(p.x,p.y);confCtx.rotate(p.rot*Math.PI/180);
        confCtx.fillStyle=p.color;
        confCtx.fillRect(-p.size/2,-p.size/4,p.size,p.size/2);
        confCtx.restore();
      });
      confettiParticles=confettiParticles.filter(function(p){return p.life>0&&p.y<(wrap.offsetHeight||2000)+60;});
    }
    function fireConfettiAt(el,count){
      var r=el.getBoundingClientRect();
      var wrapR=wrap.getBoundingClientRect();
      burstConfetti(r.left-wrapR.left+r.width/2,r.top-wrapR.top+r.height/2+(scroller?scroller.scrollTop:0),count);
      confettiRunning=true;
    }

    // Ambient confetti
    var ambientConfetti=[];
    var AMBIENT_SHAPES=["rect","circle","line"];
    var ambientSpawnTimer=0;
    var ambientActive=!prefersReducedMotion;
    var animRunning=true;

    function spawnAmbient(){
      var w=wrap.offsetWidth||800;
      var scrollY=scroller?scroller.scrollTop:0;
      var shape=AMBIENT_SHAPES[Math.floor(Math.random()*AMBIENT_SHAPES.length)];
      ambientConfetti.push({
        x:Math.random()*w,y:scrollY-12,size:4+Math.random()*6,
        color:CONFETTI_COLORS[Math.floor(Math.random()*CONFETTI_COLORS.length)],
        rot:Math.random()*360,vrot:(Math.random()-.5)*3,
        vy:0.4+Math.random()*0.8,vx:(Math.random()-.5)*0.4,
        drift:Math.random()*Math.PI*2,driftSpeed:0.008+Math.random()*0.012,
        opacity:0.18+Math.random()*0.18,shape:shape
      });
    }
    function tickAmbient(){
      if(!animRunning) return;
      if(!wrap.parentElement){animRunning=false;return;}
      if(!ambientActive&&!ambientConfetti.length&&!confettiParticles.length) return;
      requestAnimationFrame(tickAmbient);
      if(!confCtx) return;
      confCtx.clearRect(0,0,confettiCanvas.width,confettiCanvas.height);
      if(confettiRunning) tickConfetti();
      ambientSpawnTimer++;
      if(ambientActive&&ambientSpawnTimer%3===0) spawnAmbient();
      var h=wrap.offsetHeight||2000;
      ambientConfetti.forEach(function(p){
        p.y+=p.vy;p.drift+=p.driftSpeed;
        p.x+=p.vx+Math.sin(p.drift)*0.3;p.rot+=p.vrot;
        confCtx.save();confCtx.globalAlpha=p.opacity;
        confCtx.translate(p.x,p.y);
        confCtx.rotate(p.rot*Math.PI/180);confCtx.fillStyle=p.color;
        if(p.shape==="rect"){confCtx.fillRect(-p.size/2,-p.size/4,p.size,p.size/2);}
        else if(p.shape==="circle"){confCtx.beginPath();confCtx.arc(0,0,p.size/2.5,0,Math.PI*2);confCtx.fill();}
        else{confCtx.strokeStyle=p.color;confCtx.lineWidth=1.5;confCtx.globalAlpha=p.opacity*0.8;confCtx.beginPath();confCtx.moveTo(-p.size/2,0);confCtx.lineTo(p.size/2,0);confCtx.stroke();}
        confCtx.restore();
      });
      var scrollY=scroller?scroller.scrollTop:0;
      var viewH=scroller?scroller.clientHeight:800;
      ambientConfetti=ambientConfetti.filter(function(p){return p.y<scrollY+viewH+40&&p.y>scrollY-40;});
    }
    if(!prefersReducedMotion){
      var initScrollY=scroller?scroller.scrollTop:0;
      var initViewH=scroller?scroller.clientHeight:800;
      for(var ai=0;ai<60;ai++){
        spawnAmbient();
        ambientConfetti[ambientConfetti.length-1].y=initScrollY+Math.random()*initViewH;
      }
      tickAmbient();
    }

    // ── Scroll progress bar ──
    if(scroller){
      scroller.addEventListener("scroll",function(){
        var pct=scroller.scrollTop/(scroller.scrollHeight-scroller.clientHeight);
        var bar=wrap.querySelector("#kpix-scrollbar");
        if(bar) bar.style.transform="scaleX("+Math.min(pct,1)+")";
      },{passive:true});
    }

    // ── Burst fill update ──
    var allTicks=wrap.querySelectorAll(".atick");
    var allArcs=wrap.querySelectorAll(".aarc");
    var burstValEl=wrap.querySelector("#kpix-burstVal");

    function updateBurstFill(progress){
      var burstStart=0.10, burstEnd=0.32;
      var burstP=gsap.utils.clamp(0,1,(progress-burstStart)/(burstEnd-burstStart));
      allTicks.forEach(function(t,i){
        var tickThreshold=i/allTicks.length;
        var isActive=t.dataset.active==="true";
        if(burstP>=tickThreshold){t.setAttribute("opacity",isActive?0.7:0.08);}
        else{t.setAttribute("opacity","0");}
      });
      allArcs.forEach(function(a,i){
        var arcThreshold=i/allArcs.length;
        var arcP=gsap.utils.clamp(0,1,(burstP-arcThreshold*0.7)/0.35);
        a.setAttribute("stroke-dashoffset",200*(1-arcP));
        a.setAttribute("opacity",arcP>0?0.25*Math.min(arcP*2,1):0);
      });
      var val=Math.round(avgKPI*burstP);
      if(burstValEl) burstValEl.innerHTML=val+'<sup>%</sup>';
    }

    // ── ScrollTrigger config ──
    // Hero content starts VISIBLE — ScrollTrigger is progressive enhancement
    updateBurstFill(1);
    var sfElInit=wrap.querySelector("#kpix-ayScoreFloat");
    if(sfElInit) sfElInit.innerHTML=avgKPI+'<sup>%</sup>';
    wrap.querySelectorAll("#kpix-ayDomains .ay-dbar-fill").forEach(function(f,i){
      f.style.height=domains[i].score+"%";
    });

    // Try to set up scroll-driven animations
    var stWorking=false;
    try{
      var stConfig={scroller:useScroller};

      if(!prefersReducedMotion){
        // Entrance animation (plays immediately, no scroll needed)
        gsap.from(wrap.querySelector(".hero-eyebrow"),{opacity:0,y:20,duration:0.8,delay:0.2,ease:"power2.out"});
        gsap.from(wrap.querySelector(".hero-title"),{opacity:0,y:30,duration:0.9,delay:0.4,ease:"power2.out"});
        gsap.from(wrap.querySelector(".burst-zone"),{scale:.7,opacity:0,duration:1.2,delay:0.6,ease:"back.out(1.2)"});
        gsap.from(wrap.querySelector(".da-legend"),{opacity:0,y:16,duration:0.8,delay:1.0,ease:"power2.out"});

        // Scroll-driven hero→AY card transition
        var pinTl=gsap.timeline({
          scrollTrigger:Object.assign({},stConfig,{
            trigger:"#kpix-pin-wrap",start:"top top",end:"bottom bottom",scrub:0.6,
            onUpdate:function(self){
              stWorking=true;
              var p=self.progress;

              updateBurstFill(Math.min(p*3.3,1));
              if(p>=0.68){
                var ayP=gsap.utils.clamp(0,1,(p-0.68)/0.22);
                var sfEl=wrap.querySelector("#kpix-ayScoreFloat");
                if(sfEl) sfEl.innerHTML=Math.round(avgKPI*ayP)+'<sup>%</sup>';
                wrap.querySelectorAll("#kpix-ayDomains .ay-dbar-fill").forEach(function(f,i){
                  f.style.height=(domains[i].score*ayP)+"%";
                });
              }
            }
          })
        });
        pinTl.to(wrap.querySelector(".scroll-cue"),{opacity:0,duration:.5},0)
          .to(wrap.querySelector("#kpix-scene1"),{opacity:0,y:-40,duration:1.5},4.5)
          .to(wrap.querySelector(".blob1"),{opacity:0,duration:1.5},4.5)
          .to(wrap.querySelector(".blob2"),{opacity:0,duration:1.5},4.5)
          .fromTo(wrap.querySelector("#kpix-ayCompare"),{opacity:0},{opacity:1,duration:1},6)
          .fromTo(wrap.querySelector(".ay-card"),{y:60,scale:.92,rotateZ:-2},{y:0,scale:1,rotateZ:0,duration:1},6)
          .fromTo(wrap.querySelectorAll(".aypeak"),{opacity:0},{opacity:1,duration:1.2,stagger:.1},7)
          .fromTo(wrap.querySelectorAll(".ay-tnode"),{opacity:0,y:10},{opacity:1,y:0,duration:.8,stagger:.12},7.5)
          .fromTo(wrap.querySelectorAll(".ay-dbar"),{opacity:0,y:8},{opacity:1,y:0,duration:.8,stagger:.06},8)
        ;

        gsap.to(wrap.querySelector(".blob1"),{y:60,x:20,duration:6,repeat:-1,yoyo:true,ease:"sine.inOut"});
        gsap.to(wrap.querySelector(".blob2"),{y:-40,x:-30,duration:8,repeat:-1,yoyo:true,ease:"sine.inOut"});
      }
    }catch(e){
      // ScrollTrigger failed — content is already visible, just continue
      console.warn("ScrollTrigger setup failed:",e);
    }

    // Fallback: if ScrollTrigger never fires, show AY card after 2s
    setTimeout(function(){
      if(!stWorking){
        var ayComp=wrap.querySelector("#kpix-ayCompare");
        if(ayComp&&getComputedStyle(ayComp).opacity==="0"){
          // ScrollTrigger didn't work — collapse pin-wrap and show both sections
          var pinWrap=wrap.querySelector("#kpix-pin-wrap");
          if(pinWrap) pinWrap.style.height="auto";
          var stage=wrap.querySelector("#kpix-stage");
          if(stage){stage.style.position="relative";stage.style.height="auto";stage.style.minHeight="100vh";}
          var scene1=wrap.querySelector("#kpix-scene1");
          if(scene1){scene1.style.position="relative";scene1.style.paddingTop="60px";scene1.style.paddingBottom="40px";}
          ayComp.style.position="relative";
          ayComp.style.opacity="1";
          ayComp.style.pointerEvents="auto";
          ayComp.style.paddingTop="40px";
          ayComp.style.paddingBottom="60px";
        }
      }
    },2000);

    // ── Set final values for all sections (visible without animation) ──
    // These run immediately so content is never invisible.
    // ScrollTrigger onEnter callbacks below add the cinematic entrance.
    wrap.querySelectorAll(".psv").forEach(function(el){
      var finalVal=+el.closest(".pod-score").dataset.final;
      el.textContent=Math.round(finalVal);
    });
    wrap.querySelectorAll(".pod-riser").forEach(function(riser){
      riser.style.height=riser.dataset.h+"px";
    });
    // Crown visible by default
    var crownEl=wrap.querySelector(".pod-crown");
    if(crownEl){crownEl.style.opacity="1";crownEl.style.transform="translateX(-50%) scale(1)";}
    // Horizon landscape: mountains visible by default (no opacity 0 — content-visible pattern)
    var hzScoreEl=wrap.querySelector("#kpix-hzScore");
    if(hzScoreEl) hzScoreEl.innerHTML=avgKPI+'<sup>%</sup>';
    // Drilldown bar fills
    wrap.querySelectorAll(".drow .fill").forEach(function(f){
      f.style.width=(f.dataset.w||0)+"%";
    });

    // Research marquee (works without ScrollTrigger)
    var track=wrap.querySelector("#kpix-marqueeTrack");
    var marqueeTween;
    function initMarquee(){
      if(!track||track.scrollWidth<1) return;
      var setW=track.scrollWidth/2;
      gsap.set(track,{x:0});
      marqueeTween=gsap.to(track,{x:-setW,duration:45,ease:"none",repeat:-1});
    }
    if(!prefersReducedMotion&&publications.length>0){
      requestAnimationFrame(function(){requestAnimationFrame(initMarquee);});
      var viewport=wrap.querySelector(".marquee-viewport");
      if(viewport){
        viewport.addEventListener("mouseenter",function(){if(marqueeTween)marqueeTween.pause();});
        viewport.addEventListener("mouseleave",function(){if(marqueeTween)marqueeTween.play();});
      }
    }

    // ScrollTrigger entrance animations (progressive enhancement)
    try{
    ScrollTrigger.create(Object.assign({},stConfig,{
      trigger:"#kpix-podium",start:"top 55%",once:true,
      onEnter:function(){
        // Reset to animate from zero
        var crown=wrap.querySelector(".pod-crown");
        if(crown) gsap.set(crown,{opacity:0,scale:0,x:"-50%"});
        // Cards enter in podium order
        var cards=wrap.querySelectorAll(".pod-card");
        var enterOrder=[2,1,3,0,4];
        enterOrder.forEach(function(i,delay){
          if(cards[i]) gsap.from(cards[i],{opacity:0,y:30,duration:D(.7),delay:delay*D(.12),ease:E("power3.out")});
        });
        // Risers grow from 0
        wrap.querySelectorAll(".pod-riser").forEach(function(riser,i){
          var h=riser.dataset.h+"px";
          gsap.fromTo(riser,{height:0},{height:h,duration:D(1)+i*.08,delay:D(.3)+i*.08,ease:E("power3.out")});
        });
        // Scores count up
        wrap.querySelectorAll(".psv").forEach(function(el){
          var finalVal=+el.closest(".pod-score").dataset.final;
          gsap.to({v:0},{v:finalVal,duration:D(1.2),delay:D(.4),ease:"power2.out",onUpdate:function(){el.textContent=Math.round(this.targets()[0].v);}});
        });
        // Crown pops in
        gsap.to(crown,{opacity:1,scale:1,duration:D(.5),delay:D(.7),ease:E("back.out(2)")});
        // Confetti burst
        if(!prefersReducedMotion){
          var goldCard=wrap.querySelector(".pod-1");
          if(goldCard) setTimeout(function(){fireConfettiAt(goldCard,170);},800);
        }
      }
    }));
    ScrollTrigger.create(Object.assign({},stConfig,{
      trigger:"#kpix-achievements",start:"top 70%",once:true,
      onEnter:function(){
        if(track&&track.children.length){
          gsap.from(track.children,{opacity:0,y:20,duration:D(.8),stagger:D(.06),ease:E("power3.out")});
        }
      }
    }));
    ScrollTrigger.create(Object.assign({},stConfig,{
      trigger:"#kpix-metrics",start:"top 65%",once:true,
      onEnter:function(){
        // Mountains rise from the ground — cinematic entrance
        var mtns=wrap.querySelectorAll(".hz-mtn");
        gsap.fromTo(mtns,{y:80,opacity:0},{y:0,opacity:1,duration:D(1.2),stagger:D(.1),ease:E("power3.out")});
        // Legend slides in from left
        var legend=wrap.querySelector("#kpix-hzLegend");
        if(legend) gsap.fromTo(legend,{opacity:0,x:-20},{opacity:1,x:0,duration:D(.8),delay:D(.4),ease:E("power2.out")});
        // Badge scales in
        var badge=wrap.querySelector("#kpix-hzBadge");
        if(badge) gsap.fromTo(badge,{opacity:0,scale:.85},{opacity:1,scale:1,duration:D(.6),delay:D(.6),ease:E("back.out(2)")});
        // Score counts up
        gsap.to({v:0},{v:avgKPI,duration:D(1.5),delay:D(.3),ease:E("power2.out"),onUpdate:function(){
          var hs=wrap.querySelector("#kpix-hzScore");
          if(hs) hs.innerHTML=Math.round(this.targets()[0].v)+'<sup>%</sup>';
        }});
      }
    }));
    }catch(e){console.warn("Section ScrollTrigger failed:",e);}

    // ── Generic reveal ──
    wrap.querySelectorAll(".reveal").forEach(function(revEl){
      gsap.set(revEl,{opacity:1,y:0});
      gsap.fromTo(revEl,{opacity:0,y:prefersReducedMotion?10:30},{opacity:1,y:0,duration:D(.8),ease:E("power3.out"),
        scrollTrigger:Object.assign({},stConfig,{trigger:revEl,start:"top 88%"})
      });
    });

    // ── Nav dots active state ──
    var dotSections=["kpix-pin-wrap","kpix-podium","kpix-achievements","kpix-metrics"];
    var dots=wrap.querySelectorAll("#kpix-navdots a");
    dotSections.forEach(function(id,i){
      ScrollTrigger.create(Object.assign({},stConfig,{
        trigger:"#"+id,start:"top center",end:"bottom center",
        onToggle:function(self){if(self.isActive){dots.forEach(function(d){d.classList.remove("active");});if(dots[i])dots[i].classList.add("active");}}
      }));
    });

    ScrollTrigger.refresh();
  },0);

  return wrap;
}

// ─── ONCALL MODULE ───────────────────────────────────────────────────────────
function renderOncallEditModal(){
  if(!STATE.oncallEditDate)return null;
  const blk=STATE.oncallBlock||CURRENT_PERIOD;
  const date=STATE.oncallEditDate;
  const isWe=isWeekendDate(date);
  const slots=isWe?ONCALL_SLOTS:ONCALL_SLOTS.filter(s=>!s.ctu);
  const existing={};
  ONCALL_DATA.filter(e=>e.schedule_date===date).forEach(e=>{existing[e.slot_key]={resId:e.resident_id,resName:e.resident_name||"",isExtra:e.is_extra};});
  function close(){set({oncallEditDate:null});}
  async function doSave(entries){
    const btn=document.getElementById("oc_save_btn");
    if(btn){btn.disabled=true;btn.textContent="Saving...";}
    await saveOncallDay(blk,date,entries);
    set({oncallEditDate:null});
  }
  async function save(){
    const entries=slots.map(s=>({
      slot_key:s.key,
      resident_name:document.getElementById("oc_name_"+s.key)?.value.trim()||null,
      resident_id:document.getElementById("oc_name_"+s.key)?.value.trim()?null:(document.getElementById("oc_"+s.key)?.value||null),
      is_extra:document.getElementById("oc_extra_"+s.key)?.checked||false
    }));
    const dayPublished=ONCALL_DATA.some(e=>e.schedule_date===date&&e.published);
    if(dayPublished){
      showConfirm("This day is already published and visible to residents. Save these changes to the live schedule?",()=>doSave(entries),"Save Changes","warn");
    }else{
      await doSave(entries);
    }
  }
  const[y,m,d]=date.split("-").map(Number);
  const DAY_NM=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
  const dayName=DAY_NM[new Date(y,m-1,d).getDay()];
  return el("div",{cls:"modal-overlay",onClick:e=>{if(e.target===e.currentTarget)close();}},
    el("div",{cls:"modal-card",st:{width:"560px",maxWidth:"100%"}},
      el("div",{cls:"modal-header"},
        el("h3",{cls:"modal-title"},(isWe?"":"")+" On-Call — "+dayName+", "+fmtDate(date)),
        el("button",{cls:"modal-close",onClick:close},"×")
      ),
      el("div",{cls:"modal-body"},
        isWe
          ?el("div",{cls:"alert-yellow",st:{marginBottom:"16px",fontSize:".83rem"}},"Weekend: ER/Bldg/Consult = 08:00–22:00. CTU Cover = 08:00–16:00 (day cover only).")
          :el("div",{st:{background:"#f0f9ff",border:"1px solid #bae6fd",borderRadius:"8px",padding:"10px 14px",marginBottom:"16px",fontSize:".83rem",color:"#0369a1"}},"Weekday: On-call runs 16:00–22:00."),
        el("div",{st:{display:"flex",flexDirection:"column",gap:"12px"}},
          ...slots.map(s=>{
            const cur=existing[s.key]||{resId:"",resName:"",isExtra:false};
            const sel=document.createElement("select");
            sel.id="oc_"+s.key;sel.className="input";sel.style.cssText="font-size:.82rem;";
            if(cur.resName)sel.disabled=true,sel.style.opacity="0.4";
            const emp=document.createElement("option");emp.value="";emp.textContent="— Not assigned —";sel.appendChild(emp);
            sortByLevel(RESIDENTS).forEach(r=>{
              const opt=document.createElement("option");
              opt.value=r.id;opt.textContent=dname(r.name)+" ("+r.level+")";
              if(r.id==cur.resId)opt.selected=true;
              sel.appendChild(opt);
            });

// A month grid over every schedule the portal already holds client-side, plus the
// one-off events PD/chief pin on top (calendar_events). Read-only for residents;
// PD/chief can also preview any resident's calendar.
const CAL_SRC={
  oncall:{c:"#1a4a7a",n:"On-call"},mm:{c:"#c97a2a",n:"Morning Meeting"},
  teach:{c:"#A47A28",n:"Academic Day"},leave:{c:"#0e78ba",n:"Leave"},
  ann:{c:"#26523A",n:"Deadline"},custom:{c:"#c96a4a",n:"Program event"}
};
const CAL_MONTHS=["January","February","March","April","May","June","July","August","September","October","November","December"];
const CAL_DOW=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
// Draft rows are hidden from residents exactly as they are in the source modules.
function calSeesDrafts(){const u=STATE.user;return!!u&&(isPdRole(u.role)||u.role==="chief"||u.role==="consultant");}
// On-call and leave are per-resident, so in the programme-wide view they arrive for
// all ~38 residents at once and bury everything else. They start hidden there.
function calHiddenSrc(program){
  if(STATE.calSrcOff)return new Set(STATE.calSrcOff);
  return new Set(program?["oncall","leave"]:[]);
}
function calToggleSrc(k,program){
  const off=calHiddenSrc(program);
  off.has(k)?off.delete(k):off.add(k);
  set({calSrcOff:[...off]});
}
function calBuildEvents(rid,program){
  const ev={},seeAll=calSeesDrafts();
  const push=(d,t,title,time)=>{if(d)(ev[d]=ev[d]||[]).push({t,title,time});};
  const who=id=>{const r=anyResById(id);return r?dname(r.name):"#"+id;};
  ONCALL_DATA.filter(e=>(program?!!e.resident_id:(rid&&e.resident_id===rid))&&(seeAll||e.published)).forEach(e=>{
    const sl=ONCALL_SLOTS.find(s=>s.key===e.slot_key);
    push(e.schedule_date,"oncall",(program?who(e.resident_id)+" · ":"")+(sl?sl.label:e.slot_key)+(e.is_extra?" · Extra":""),oncallHoursLabel(e.slot_key,e.schedule_date).slice(0,5));
  });
  // The chip leads with the topic: the colour dot and the legend already name the source,
  // so repeating "Morning Meeting:" in every cell only costs width the column does not have.
  MM_SESSIONS.filter(s=>seeAll||s.published).forEach(s=>{
    const role=program?"":(rid&&s.presenter_resident_id==rid?" · Presenter":rid&&s.moderator_resident_id==rid?" · Moderator":"");
    push(s.session_date,"mm",(s.topic||"Morning Meeting")+role,"08:00");
  });
  TEACH_SESSIONS.filter(s=>seeAll||s.published).forEach(s=>{
    push(s.session_date,"teach",s.topic||"Academic Day","15:00");
  });
  const leaveFor=(id,pre)=>{
    const ld=LEAVE_DATA[id]||{};
    (ld.manual||[]).filter(l=>l.approved&&l.from&&l.to).forEach(l=>{
      for(let d=l.from;d<=l.to;d=oncallAddDays(d,1))push(d,"leave",pre+"Annual leave",null);
    });
    (ld.rota||[]).forEach(l=>{
      const st=blockStartDate(l.period,CURRENT_ACADEMIC_YEAR);if(!st)return;
      // Leave is always measured against a 4-week block: it does not stretch into
      // block 13's 5th week, and a split is labelled "Wk 1-2"/"Wk 3-4" everywhere else.
      const wks=l.partial?l.weeks:4;
      const off=(l.partial&&l.position==="end")?(4-l.weeks)*7:0;
      const s0=toLocalYMD(new Date(st.getTime()+off*86400000));
      const kind=(l.rot||"").includes("Maternity")?"Maternity leave":"Annual leave";
      for(let i=0;i<wks*7;i++)push(oncallAddDays(s0,i),"leave",pre+kind,null);
    });
  };
  if(program)RESIDENTS.forEach(r=>leaveFor(r.id,who(r.id)+" · "));
  else leaveFor(rid,"");
  (program?ANNOUNCEMENTS:announcementsForResident(rid)).filter(a=>a.deadline_date).forEach(a=>{
    push(a.deadline_date,"ann",a.title+" — due",null);
  });
  // Day-scope entries (leave, deadlines) first, then the timed ones in clock order,
  // so a cell reads top to bottom the way the day actually runs.
  Object.keys(ev).forEach(d=>ev[d].sort((a,b)=>(a.time||"").localeCompare(b.time||"")));
  return ev;
}

      const{data:profile}=await sb.from("profiles").select("*").eq("id",session.user.id).single();
      if(profile){
        STATE.user=mapProfileToUser(profile);
        STATE.calToken=profile.calendar_token||null;
        STATE.calPrefs=profile.calendar_prefs||{rota:true,oncall:true,mm:true,teach:false,deadlines:true};
        await loadCoreData();
        if(profile.role==="pd")checkPromotionNeeded();
        loadPendingCounselCount();
        loadSchedules();
        loadRotations();
        loadLeaveRecords();
        loadAnnouncements();
        loadCalendarEvents();
        loadKpiQuarterly();
        loadKpiProposals();
        loadOncallData();
        loadBestResident();
        loadLeavePlan();
        loadGimPrefs();
        loadGimStatus();
        loadLpStatus();
        loadChiefElection();
        loadR4Prefs();
        loadR4PrefsStatus();
        loadNotifications();
        setInterval(()=>{if(STATE.user)loadNotifications();},60000);
        loadQuizzes().catch(e=>console.warn("Quiz load failed:",e));
      }
    }
  }catch(err){
    console.error("Init error:",err);
    document.body.innerHTML='<div style="padding:40px;text-align:center;font-family:system-ui"><h2 style="color:#b52040">Failed to load portal</h2><p style="color:#666">'+err.message+'</p><button onclick="location.reload()" style="margin-top:16px;padding:10px 24px;background:#c96a4a;color:#fff;border:none;border-radius:999px;cursor:pointer;font-size:1rem">Retry</button></div>';
  }
  STATE.loading=false;render();
})();
</script>
</body>
</html>
